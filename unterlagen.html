<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dein Berater – Unterlagen</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='10' fill='%232b5fe3'/%3E%3C/svg%3E">
<style>
/* quoroai-plattform-design · Unterlagen: alles, was die Beratung freigegeben hat
   V13 (Issue #58): das Kopfband ist bis zur Unterkante deckend.
   V14 (Paket A4, Issue #56): Die Bitte um eine Unterlage fragt vor dem Verschicken
   nach — mit Dateiname und Empfänger (sicher.js, bitten.js) —, sagt danach, an wen
   sie ging, und lässt sich eine Minute lang zurücknehmen; dann geht das Blatt hier
   auch wieder aus dem Bestand.
   V15 (Denkfehler 4 und Issue #53): Die Zusammenfassung des Beratungsvertrags
   nennt Pauschale, Umsatzsteuer, Laufzeit und Kündigungsfrist mit Zahl und
   Datum, statt sie zu umschreiben — die Prüfung hat „monatliche Pauschale"
   ohne Betrag als Auslassung gelesen. Und keine Fassung steht mehr relativ
   da: „heute" und „gestern" tragen ihr Datum, die Tage kommen aus der Lage
   (lage.js), die Jahreszahl steht bei jedem Dokumentdatum.
   V16 (Nutzerprüfung 2026-08-16): Bei 390 Bildpunkten zerfiel die Zeile
   „Rahmenvertrag Stahl" — die Namensspalte ging auf 0 Bildpunkte Breite und
   180 hoch, der Text lief als Ein-Wort-Säule senkrecht durch, die Pille lag
   über dem Symbol. Der Name bekommt jetzt die ganze erste Zeile. Dazu
   Fingermaß für „↓ Laden" und „Fassungen" (35 bzw. 31 Bildpunkte hoch) und
   der Vorführ-Griff im Kopfband verschwindet schmal wirklich.
   Marker: UNTERLAGEN-V16 (V9: Häppchen D1, die offene Bitte um eine Unterlage
   steht über dem Bestand. V10: Häppchen D3 — am ersten Tag liegt hier genau ein
   Dokument, der Beratungsvertrag. Ein neuer Kunde mit fünf Beratungsdokumenten
   in der Akte wäre eine Behauptung. V11: Häppchen D4 — die Unterlage wird
   hier gelesen, Seite für Seite; Laden ist der zweite Weg, nicht der einzige.
   Die Seiten kommen aus blaetter.js, es sind dieselben, die die Beratung in
   der Akte sieht.)
   V12: der Hinweis startet leer, wird gesprochen (role=status) und räumt
   seinen Satz erst nach der Überblendung weg. Im Markup stand er fest —
   das Vorlesen las ihn beim Betreten der Seite mit, ohne dass jemand
   etwas gedrückt hatte. */
@font-face{
  font-family:'Manrope';
  src:url('schriften/manrope.woff2') format('woff2');
  font-weight:200 800;
  font-display:swap;
}
@font-face{
  font-family:'Caveat';
  src:url('schriften/caveat.woff2') format('woff2');
  font-weight:400 700;
  font-display:swap;
}
:root{
  --papier:#fafaf7;--tinte:#10131a;--grau:#636c7d;--blau:#2b5fe3;--stift:#1d46c9;
  --linie:rgba(16,19,26,.1);--karte:#ffffff;--radius:16px;--feder:cubic-bezier(.22,.9,.24,1);
}
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:var(--papier);color:var(--tinte);
  font-family:'Manrope',system-ui,sans-serif;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit}

nav{
  position:fixed;top:0;left:0;right:0;z-index:10;height:60px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 max(24px,calc((100vw - 880px)/2));
  /* Deckend bis zur Unterkante. Der Verlauf begann bei 55 % der Bandhoehe —
     genau dort steht die zweite Kopfzeile, und beim Rollen druckte der Inhalt
     durch sie hindurch, Buchstaben ueber Buchstaben (Pruefung 2026-08-16,
     Issue #58). Die weiche Kante bleibt; sie liegt jetzt UNTER dem Band,
     wo kein Text steht. */
  background:var(--papier);
}
/* Die weiche Kante des Kopfbands: liegt unter dem Band, nicht darin. */
nav::after{
  content:'';position:absolute;left:0;right:0;top:100%;height:22px;
  background:linear-gradient(var(--papier), color-mix(in srgb, var(--papier) 1%, transparent));
  pointer-events:none;
}
nav .wortmarke{font-weight:800;font-size:15px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
nav .wortmarke .marke-logo{height:26px;width:auto;display:block}
nav .wortmarke [data-marke-name]{display:block}
nav .wortmarke .marke-wechsel{cursor:pointer;pointer-events:auto;display:inline-block}
nav .wortmarke .marke-wechsel:hover{color:var(--blau)}
nav .wortmarke small{display:block;font-size:11px;font-weight:500;color:var(--grau)}
nav .zurueck{
  padding:9px 16px;border-radius:999px;border:0.5px solid var(--linie);
  background:#fff;font-size:12.5px;font-weight:700;color:var(--tinte);
  text-decoration:none;transition:border-color .2s;
}
nav .zurueck:hover{border-color:var(--blau)}

main{max-width:880px;margin:0 auto;padding:108px 24px 96px}
.anstrich{width:96px;height:12px;display:block;overflow:visible;margin-bottom:16px}
.anstrich path{fill:none;stroke:var(--stift);stroke-width:2.5;stroke-linecap:round;opacity:.85}
h1{font-size:clamp(28px,4.6vw,42px);font-weight:800;letter-spacing:-.03em;line-height:1.15}
.unter{color:var(--grau);font-size:15px;margin-top:4px}

#gebeten{margin-top:26px;max-width:640px}
#gebeten .gebeten-titel{font-size:13px;font-weight:800;color:var(--grau)}

.suche{position:relative;margin-top:24px;max-width:560px}
.suche input{
  width:100%;min-height:50px;padding:0 22px 0 48px;border-radius:999px;
  border:0.5px solid var(--linie);background:#fff;
  font-family:inherit;font-size:15px;color:var(--tinte);outline:none;
  box-shadow:0 8px 30px rgba(16,19,26,.06);
}
.suche input:focus{border-color:var(--blau)}
.suche svg{position:absolute;left:18px;top:50%;translate:0 -50%;width:18px;height:18px}
.suche svg path{fill:none;stroke:var(--grau);stroke-width:2;stroke-linecap:round}
.treffer-zeile{font-size:12.5px;color:var(--grau);margin-top:10px;min-height:1.2em}

.zeilen{margin-top:20px;display:flex;flex-direction:column;gap:10px}
.dok{
  border:0.5px solid var(--linie);background:#fff;border-radius:var(--radius);
  box-shadow:0 6px 20px rgba(16,19,26,.05);overflow:hidden;
}
.dok.versteckt{display:none}
.dok .kopf{
  display:flex;align-items:center;gap:16px;padding:15px 20px;
}
/* Das Blatt und sein Name sind der Griff: ein Druck schlägt die Unterlage auf
   (Häppchen D4, blatt.js). Vorher war die ganze Kopfzeile klickbar — mit den
   Knöpfen darin war das ein Ziel, das andere Ziele enthielt. */
.dok .d-oeffnen{
  display:flex;align-items:center;gap:16px;flex:1;min-width:0;
  border:0;background:none;padding:0;cursor:pointer;
  font:inherit;color:inherit;text-align:left;border-radius:10px;
}
.dok .d-oeffnen:focus-visible{outline:3px solid var(--blau);outline-offset:4px}
.dok .blatt{transition:border-color .2s ease,box-shadow .2s ease}
@media (hover:hover){
  .dok .d-oeffnen:hover .titel{color:var(--blau)}
  .dok .d-oeffnen:hover .blatt{border-color:color-mix(in srgb, var(--blau) 35%, transparent);box-shadow:0 5px 14px rgba(16,19,26,.1)}
}
.blatt{
  width:34px;height:44px;flex-shrink:0;position:relative;
  background:#fff;border:1px solid var(--linie);border-radius:4px;
}
.blatt::before{
  content:'';position:absolute;right:-1px;top:-1px;border:8px solid transparent;
  border-left-color:color-mix(in srgb, var(--blau) 25%, transparent);
  border-bottom-color:color-mix(in srgb, var(--blau) 25%, transparent);
  border-radius:0 0 0 4px;
}
.blatt::after{
  content:'';position:absolute;left:6px;right:6px;top:13px;height:19px;
  background:linear-gradient(var(--linie) 1.5px, transparent 1.5px);background-size:100% 6px;
}
.dok .titel{display:block;font-size:15px;font-weight:800;letter-spacing:-.01em;transition:color .2s ease}
.dok .titel mark{background:color-mix(in srgb, var(--blau) 18%, transparent);color:inherit;border-radius:3px;padding:0 2px}
.dok .meta{display:block;font-size:12.5px;color:var(--grau);margin-top:2px}
.dok .status{
  flex-shrink:0;margin-left:auto;font-size:11px;font-weight:800;
  padding:4px 10px;border-radius:999px;color:var(--grau);background:rgba(16,19,26,.05);white-space:nowrap;
}
.dok .status.neu{color:#fff;background:var(--blau)}
.dok .auszug{
  margin:0 20px 14px 70px;padding:10px 16px;font-size:13.5px;
  border-left:3px solid var(--stift);border-radius:0 10px 10px 0;
  background:color-mix(in srgb, var(--blau) 5%, transparent);max-width:56ch;
}
.dok .auszug mark{background:color-mix(in srgb, var(--blau) 18%, transparent);color:inherit;border-radius:3px;padding:0 2px}
.dok .warnung{
  margin:0 20px 14px 70px;font-size:12.5px;color:#a06008;font-weight:700;
  display:flex;align-items:center;gap:7px;
}
.dok .warnung::before{content:'';width:7px;height:7px;border-radius:999px;background:#a06008;flex-shrink:0}
.dok .fassungen{border-top:0.5px solid var(--linie);padding:10px 20px 12px 70px}
.dok .fassungen[hidden]{display:none}
.dok .fassung{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  font-size:13px;color:var(--grau);padding:6px 0;
}
.dok .fassung .f-name{font-weight:700;color:var(--tinte)}
.dok .fassung button{
  padding:6px 14px;border-radius:999px;border:0.5px solid var(--linie);
  background:#fff;font-size:12px;font-weight:700;cursor:pointer;transition:border-color .2s;
}
.dok .fassung button:hover{border-color:var(--blau)}
.dok .aktionen{display:flex;gap:8px;align-items:center;flex-shrink:0}
.dok .aktionen button{
  padding:8px 15px;border-radius:999px;border:0.5px solid var(--linie);
  background:#fff;font-size:12.5px;font-weight:700;cursor:pointer;transition:border-color .2s,color .2s;
}
.dok .aktionen button:hover{border-color:var(--blau);color:var(--blau)}
.leer{color:var(--grau);font-size:15px;margin-top:28px}
.leer .handschrift{font-family:'Caveat',cursive;font-size:24px;color:var(--stift);display:block;rotate:-1.5deg;margin-bottom:4px}

#demo-hinweis{
  position:fixed;top:70px;left:50%;translate:-50% 6px;z-index:60;pointer-events:none;
  font-family:'Caveat',cursive;font-size:21px;font-weight:700;color:var(--stift);
  opacity:0;rotate:-1deg;transition:opacity .3s ease,translate .3s var(--feder);
}
#demo-hinweis.da{opacity:.95;translate:-50% 0}

@media (max-width:700px){
  /* Der teuerste Anblick der Vorführung stand hier: bei 390 Bildpunkten
     zerfiel „Rahmenvertrag Stahl" in eine senkrechte Ein-Wort-Säule, weil
     `.d-oeffnen` als `flex:1` (Basis 0) neben zwei nicht schrumpfenden
     Knöpfen und der Pille auf 0 Bildpunkte Breite zusammenging — der Text
     lief 180 Bildpunkte hoch daran hinunter, und „Fassung 2" lag über dem
     Symbol. Umbrechen allein half nicht, weil die Basis 0 blieb.
     Jetzt bekommt der Name die ganze erste Zeile; Zustand und Griffe stehen
     darunter, der Zustand links, die Griffe rechts. */
  .dok .kopf{flex-wrap:wrap;row-gap:12px}
  .dok .d-oeffnen{flex:1 1 100%;min-width:100%}
  .dok .status{margin-left:0}
  .dok .aktionen{margin-left:auto}
  .dok .auszug,.dok .warnung{margin-left:20px}
  .dok .fassungen{padding-left:20px}
  /* Die zweite Klasse gewann gegen `nav .wortmarke small` — der Vorführ-Griff
     stand schmal weiter da, 190 × 18 groß, und war als Tippziel unbrauchbar.
     Auf schmalen Fenstern gehört er weg, wie im Gespräch auch. */
  nav .wortmarke small,
  nav .wortmarke .marke-wechsel{display:none}
}

/* ---------- Fingermaß (Nutzerprüfung 2026-08-16) ----------
   Bei 390px maßen fünfmal „↓ Laden" 82 × 35, „Fassungen" 100 × 35 und das
   „↓ Laden" in der aufgeklappten Fassungsliste 76 × 31. Unter 40px trifft ein
   Daumen nicht zuverlässig; das Muster kommt aus uebersicht.html.
   `pointer:coarse` steht dabei, weil ein Finger auch auf einem breiten Schirm
   ein Finger bleibt. Der Block steht am Ende der Datei: bei gleicher
   Spezifität gewinnt die spätere Regel. */
@media (pointer:coarse),(max-width:700px){
  .dok .aktionen button,
  .dok .fassung button{
    min-height:44px;display:inline-flex;align-items:center;justify-content:center;
  }
}
</style>
<script src="marke.js"></script>
<!-- lage.js bringt window.Lage mit — die eine Quelle für das „Heute" des
     Entwurfs und die Termine der Woche. Diese Fläche hängt keine Glocke ins
     Chrom; sie braucht die Lage, damit die Fristen der Bitten datiert sind
     und nicht hier eine zweite Woche entsteht. Vor bitten.js, sonst stünde
     der Baustein beim Bauen der Fristen ohne Quelle da. -->
<script src="lage.js"></script>
<script src="sicher.js"></script>
<script src="bitten.js"></script>
<script src="blaetter.js"></script>
<script src="blatt.js"></script>
</head>
<body>

<nav>
  <div class="wortmarke"><img class="marke-logo" alt="" hidden><div><span data-marke-name data-logo-versteckt>Nordholm &amp; Partner</span><small class="marke-wechsel" role="button" tabindex="0" title="Andere Beispielmarke ansehen">Vorführung: Beispielmarke wechseln</small></div></div>
  <a class="zurueck" href="uebersicht.html">← Übersicht</a>
</nav>
<!-- role="status" muss sein: nach „Laden" und beim Aufschlagen ohne Baustein
     ist dieser Zettel die einzige Rückmeldung. Ungesprochen wäre sie keine.
     Und er startet leer: stünde der Satz im Markup, läse ihn das Vorlesen beim
     Betreten der Seite mit, ohne dass jemand etwas gedrückt hat. -->
<div id="demo-hinweis" role="status" aria-live="polite"></div>

<main>
  <svg class="anstrich" viewBox="0 0 96 12" aria-hidden="true"></svg>
  <h1>Unterlagen</h1>
  <p class="unter" data-du="Alles, was deine Beratung für dich freigegeben hat — mit jeder Fassung." data-sie="Alles, was Ihre Beratung für Sie freigegeben hat — mit jeder Fassung.">Alles, was deine Beratung für dich freigegeben hat — mit jeder Fassung.</p>

  <!-- Häppchen D1: Wer hier steht, will eine Unterlage — dann gehört die
       offene Datei-Anfrage hierher und nicht nur auf die Übersicht. Erledigte
       Bitten fallen weg (nurOffene): auf dieser Fläche zählt der Bestand. -->
  <section id="gebeten" hidden>
    <h2 class="gebeten-titel" data-du="Deine Beratung bittet um eine Unterlage" data-sie="Ihre Beratung bittet um eine Unterlage">Deine Beratung bittet um eine Unterlage</h2>
    <div data-bitten></div>
  </section>

  <div class="suche">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 17 a6.5 6.5 0 1 0 0-13 a6.5 6.5 0 0 0 0 13 Z M15.5 15.5 L20.5 20.5"/></svg>
    <input id="suchfeld" type="text" placeholder="In allen Unterlagen suchen" aria-label="In allen Unterlagen suchen">
  </div>
  <div class="treffer-zeile" id="treffer" aria-live="polite"></div>

  <div class="zeilen" id="liste"></div>
  <p class="leer" id="leer" hidden><span class="handschrift">Nichts gefunden.</span><span data-du="Such mit einem anderen Wort — oder frag deinen Berater danach, der kennt jede Seite." data-sie="Suchen Sie mit einem anderen Wort — oder fragen Sie Ihren Berater danach, der kennt jede Seite.">Such mit einem anderen Wort — oder frag deinen Berater danach, der kennt jede Seite.</span></p>
</main>

<script>
(function(){
  'use strict';
  /* Ohne Kern bleibt die Seite bedienbar — dann eben in Standardmarke und Du-Form */
  var Marke = window.Marke || {anwenden: function(){}, rede: function(du){ return du; }};
  Marke.anwenden();
  var reduziert = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function zufall(a, b){ return a + Math.random() * (b - a); }

  /* Anstrich */
  var NS = 'http://www.w3.org/2000/svg';
  var svg = document.querySelector('.anstrich');
  var d = 'M2 6';
  for (var i = 1; i <= 6; i++) d += ' L' + (2 + 92 * i / 6) + ' ' + (6 + zufall(-2, 2));
  var p = document.createElementNS(NS, 'path');
  p.setAttribute('d', d);
  svg.appendChild(p);
  if (!reduziert) {
    var len = p.getTotalLength();
    p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
    p.style.transition = 'stroke-dashoffset .55s cubic-bezier(.45,.05,.55,.95) .1s';
    void p.getBoundingClientRect();
    p.style.strokeDashoffset = 0;
  }

  var hinweisTimer = null, leerTimer = null;
  function demoHinweis(text){
    var h = document.getElementById('demo-hinweis');
    h.textContent = text;
    h.classList.add('da');
    clearTimeout(hinweisTimer); clearTimeout(leerTimer);
    hinweisTimer = setTimeout(function(){
      h.classList.remove('da');
      /* Leeren erst nach der Überblendung: durchsichtig ist der Satz nur fürs
         Auge, im Vorlesebaum stünde er weiter — im selben Zug geleert
         verschwände er schlagartig, statt zu verklingen. */
      leerTimer = setTimeout(function(){ h.textContent = ''; }, 320);
    }, 2200);
  }

  /* Demo-Bestand: Titel, Meta, Fassungen, Volltext für die Suche.
     Am ersten Tag (Häppchen D3, Lage aus bitten.js) liegt genau ein Dokument
     hier: der Beratungsvertrag, den die offene Abnahme oben meint. Alles andere
     wäre eine Akte, die ein neuer Kunde nicht haben kann. */
  /* Datiert statt relativ (Denkfehler 4 der Nutzerprüfung): „heute" und
     „gestern" helfen beim Lesen, aber nie allein — sonst weiß niemand, ob
     eine Fassung von dieser oder der letzten Woche ist. Welcher Tag welches
     Datum trägt, sagt die Lage (lage.js), damit hier keine zweite Woche
     entsteht; ohne den Baustein bleibt dieselbe Woche als fester Wortlaut. */
  var Lage = window.Lage || null;
  var TAGE_ERSATZ = ['17.08.2026', '18.08.2026', '19.08.2026', '20.08.2026', '21.08.2026'];
  function tagDatum(i){
    var t = Lage && Lage.tage && Lage.tage()[i];
    return t ? t.kurzdatum + '2026' : (TAGE_ERSATZ[i] || TAGE_ERSATZ[1]);
  }
  function heuteZahl(){ return Lage && Lage.heute ? Lage.heute() : 1; }
  function heuteDatum(){ return tagDatum(heuteZahl()); }
  function gesternDatum(){ return tagDatum(heuteZahl() - 1); }

  var ersterTag = !!(window.Bitten && Bitten.lage() === 'erster-tag');
  /* Die Seiten der Dokumente stehen in blaetter.js, einmal für alle Flächen —
     derselbe Rahmenvertrag, den die Beratung in der Akte sieht (Häppchen D4).
     Was hier steht, ist die Sicht des Kunden darauf: wie das Blatt hier heißt,
     was in der Zeile darunter steht, und was durchsucht wird. */
  function blatt(name, sicht){
    /* Der Name der Beratung kommt aus marke.js — die Kundenfläche ist
       White-Label, und im Papier steht er deshalb nicht fest (blaetter.js). */
    sicht.beratung = (window.Marke && Marke.daten && Marke.daten.name) || 'deiner Beratung';
    return (window.Blaetter && Blaetter.hol(name, sicht)) || sicht;
  }
  var DOKUMENTE = ersterTag ? [
    blatt('beratungsvertrag', {
     titel: 'Beratungsvertrag',
     meta: Marke.rede('4 Seiten, heute, ' + heuteDatum() + ', von deiner Beratung', '4 Seiten, heute, ' + heuteDatum() + ', von Ihrer Beratung'), status: 'neu',
     /* Die Zusammenfassung nennt die Zahlen, statt sie zu umschreiben
        (Issue #53): „monatliche Pauschale" ohne Betrag hat in der Prüfung
        jeder für eine Auslassung gehalten. Dieselben Zahlen stehen an der
        Abnahme in bitten.js. */
     text: '2.400,00 € netto im Monat, mit Umsatzsteuer 2.856,00 €. Laufzeit zwölf Monate bis zum 30. April 2027, Kündigungsfrist drei Monate, also bis zum 31. Januar 2027. Enthalten sind der KI-Berater, die Beratungsleistung und die laufende Auswertung; jede Stunde ist damit abgegolten. Auslagen werden einzeln abgerechnet.',
     fassungen: []})
  ] : [
    blatt('benchmark', {
     titel: 'Preismodell Benchmark', meta: '12 Seiten, gestern, ' + gesternDatum() + ', Fassung 1', status: 'neu',
     text: 'Preisanpassung von vier Prozent auf die C-Kunden bringt 38.000 Euro im Jahr. Staffeln neu geschnitten, A- und B-Kunden unberührt. Branchenschnitt sechs Prozent darüber.',
     randnotiz: 'die 4 % halten!',
     fassungen: []}),
    blatt('rahmenvertrag', {
     titel: 'Rahmenvertrag Stahl',
     meta: Marke.rede('Fassung 2 vom 4. August 2026, von deiner Beratung', 'Fassung 2 vom 4. August 2026, von Ihrer Beratung'), status: 'Fassung 2',
     text: 'Preisgleitklausel nach Ziffer 3.2 endet zum 30. September. Danach gilt der Tagespreis des Lieferanten, sofern kein neuer Rahmen vereinbart ist. Kündigungsfrist drei Monate.',
     fassungen: [{name: 'Fassung 1', meta: 'vom 12. Mai 2026'}]}),
    blatt('jahresabschluss', {
     titel: 'Jahresabschluss 2025, Entwurf',
     meta: '48 Seiten, 28. Juli 2026', status: 'geteilt',
     text: 'Umsatzerlöse 4,1 Millionen Euro, Rohertrag 31,8 Prozent, Eigenkapitalquote 38 Prozent. Vorbehaltlich der Schlussbuchungen des Steuerbüros.',
     fassungen: []}),
    blatt('fotos', {
     titel: 'Fotos Halle 2, Begehung',
     meta: '9 Bilder, 15. Juli 2026', status: 'geteilt',
     warnung: Marke.rede('Aus diesen Bildern kann dein Berater nicht zitieren — sie enthalten keinen lesbaren Text.', 'Aus diesen Bildern kann Ihr Berater nicht zitieren — sie enthalten keinen lesbaren Text.'),
     text: 'Begehung Halle zwei Fotos Anbau Brandschutz',
     fassungen: []}),
    /* Derselbe Branchenspiegel wie im Wissen der Beratung: derselbe Name,
       dieselbe Seitenzahl. Zwei Namen für ein Dokument wären zwei Dokumente. */
    blatt('branchenspiegel', {
     titel: 'Branchenspiegel Metallzulieferer 2025', meta: '38 Seiten, 2. Juli 2026', status: 'geteilt',
     text: 'Zulieferer mit 20 bis 80 Mitarbeitenden erzielen im Median 35,9 Prozent Rohertragsmarge. Unteres Quartil 31,2 Prozent. Energiekosten je Tonne gestiegen.',
     fassungen: []})
  ];

  var liste = document.getElementById('liste');
  function baue(){
    DOKUMENTE.forEach(function(dok){ liste.appendChild(baueEinen(dok)); });
  }
  function baueEinen(dok){
    var el = document.createElement('div');
    el.className = 'dok';
    el.innerHTML =
      '<div class="kopf">' +
      '<button class="d-oeffnen" type="button"><span class="blatt"></span>' +
      '<span style="min-width:0"><span class="titel"></span><span class="meta"></span></span></button>' +
      '<span class="status"></span>' +
      '<span class="aktionen"><button type="button" class="laden">↓ Laden</button>' +
      (dok.fassungen.length ? '<button type="button" class="ff">Fassungen</button>' : '') +
      '</span></div>' +
      '<div class="auszug" hidden></div>' +
      (dok.warnung ? '<div class="warnung"></div>' : '') +
      (dok.fassungen.length ? '<div class="fassungen" hidden></div>' : '');
    el.querySelector('.titel').textContent = dok.titel;
    el.querySelector('.meta').textContent = dok.meta;
    var st = el.querySelector('.status');
    st.textContent = dok.status;
    if (dok.status === 'neu') st.classList.add('neu');
    if (dok.warnung) el.querySelector('.warnung').textContent = dok.warnung;
    if (dok.fassungen.length) {
      var lage = el.querySelector('.fassungen');
      dok.fassungen.forEach(function(f){
        var z = document.createElement('div');
        z.className = 'fassung';
        z.innerHTML = '<span><span class="f-name"></span> <span class="f-meta"></span></span><button type="button">↓ Laden</button>';
        z.querySelector('.f-name').textContent = f.name;
        z.querySelector('.f-meta').textContent = f.meta;
        z.querySelector('button').addEventListener('click', function(){ demoHinweis('Vorführung — hier läge ' + f.name 	+ '.'); });
        lage.appendChild(z);
      });
      el.querySelector('.ff').addEventListener('click', function(e){
        e.stopPropagation();
        lage.hidden = !lage.hidden;
      });
    }
    function lade(){
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob(['# ' + dok.titel + '\n\n' + dok.text + '\n\n— Vorführung, Demo-Daten\n'], {type: 'text/markdown'}));
      a.download = dok.titel.replace(/[^\wäöüÄÖÜß-]+/g, '-') + '.md';
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
    }
    el.querySelector('.laden').addEventListener('click', function(e){
      e.stopPropagation();
      lade();
    });
    /* Der Blatt-Blick (Häppchen D4): die Unterlage wird hier gelesen. Laden
       bleibt — es ist jetzt aber der zweite Weg, nicht der einzige. */
    var griff = el.querySelector('.d-oeffnen');
    griff.setAttribute('aria-label', dok.titel + ' aufschlagen');
    griff.addEventListener('click', function(){
      if (!window.Blatt) { demoHinweis('Vorführung — im Produkt öffnet sich hier das Original.'); return; }
      dok.aus = el;
      dok.griffe = [{wort: '↓ Laden', tat: lade}];
      dok.fuss = Marke.rede('Von deiner Beratung freigegeben.', 'Von Ihrer Beratung freigegeben.');
      Blatt.zeige(dok);
    });
    dok.el = el;
    return el;
  }
  baue();

  /* ---------- Die Bitte um eine Unterlage (Häppchen D1) ----------
     Was hochgeladen wird, steht anschließend in der Liste — sonst hätte der
     Kunde etwas geschickt und sähe an derselben Stelle weiter nichts davon. */
  var gebeten = document.getElementById('gebeten');
  if (window.Bitten) Bitten.tafel({arten: ['datei'], nurOffene: true, aufAenderung: function(n, wartet){
    /* Auch eine laufende Rückfrage hält den Abschnitt offen — sonst stünde
       ihre Karte in einem versteckten Kasten. */
    gebeten.hidden = (n + wartet) === 0;
  }});
  function zeigeGeschickte(){
    if (!window.Bitten) return;
    Bitten.liste(['datei']).forEach(function(b){
      /* Nur was wirklich geschickt wurde, wird ein Blatt — eine Rückfrage ist
         keine Unterlage. */
      if (Bitten.stand(b) !== 'erledigt' || b.abgelegt) return;
      b.abgelegt = true;
      var name = String(Bitten.eingabe(b) || '');
      var wer = String(b.wer || '');
      var dok = {titel: name || 'Deine Unterlage',
                 /* Wer sie bekommen hat, steht hier genauso wie in der
                    Rückfrage davor — sonst müsste der Kunde raten, wohin sein
                    Blatt gegangen ist. */
                 /* Datiert, nicht nur „gerade eben": diese Zeile steht morgen
                    noch in der Liste, und dann ist „gerade eben" gelogen. */
                 meta: (wer ? Marke.rede('von dir an ' + wer, 'von Ihnen an ' + wer)
                            : Marke.rede('von dir', 'von Ihnen')) + ', heute, ' + heuteDatum(),
                 status: Marke.rede('von dir', 'von Ihnen'),
                 text: Marke.rede('Diese Unterlage hast du gerade geschickt. Deine Beratung hat sie.',
                                  'Diese Unterlage haben Sie gerade geschickt. Ihre Beratung hat sie.'),
                 seitenGesamt: 1,
                 seiten: [[
                   {h: name || Marke.rede('Deine Unterlage', 'Ihre Unterlage')},
                   {klein: Marke.rede('Von dir geschickt, heute, ' + heuteDatum() + '.', 'Von Ihnen geschickt, heute, ' + heuteDatum() + '.')},
                   {p: Marke.rede('Deine Beratung hat sie. In der Vorführung steht hier kein Inhalt — im Produkt öffnet sich an dieser Stelle deine Datei, Seite für Seite.',
                                  'Ihre Beratung hat sie. In der Vorführung steht hier kein Inhalt — im Produkt öffnet sich an dieser Stelle Ihre Datei, Seite für Seite.')}
                 ]],
                 fassungen: []};
      DOKUMENTE.unshift(dok);
      b.blatt = dok;
      liste.prepend(baueEinen(dok));
      /* Steht im Suchfeld etwas, gilt es auch für das neue Blatt — sonst
         stünde es über einer gefilterten Liste, in die es nicht gehört, und
         die Trefferzahl darunter wäre falsch. */
      filtere();
    });
  }
  /* Auch beim Ankommen: wer die Unterlage im Gespräch geschickt hat, findet
     sie hier vor — nicht erst, wenn er sie ein zweites Mal schickt. */
  zeigeGeschickte();
  if (window.Bitten) Bitten.abonniere(zeigeGeschickte);

  /* Zurückgenommen heißt: die Beratung hat das Blatt nicht mehr — dann darf es
     auch hier nicht weiter im Bestand liegen. Sonst nähme der Knopf es der
     Beratung weg und ließe den Kunden im Glauben, es sei angekommen. */
  document.addEventListener('bitte-zurueckgenommen', function(e){
    if (!window.Bitten) return;
    var b = Bitten.finde(e.detail && e.detail.id);
    if (!b || !b.blatt) return;
    var dok = b.blatt;
    b.blatt = null;
    b.abgelegt = false;
    var i = DOKUMENTE.indexOf(dok);
    if (i !== -1) DOKUMENTE.splice(i, 1);
    if (dok.el) dok.el.remove();
    filtere();
  });

  /* Volltextsuche mit Trefferauszug — filtert sofort beim Tippen */
  var feld = document.getElementById('suchfeld');
  var treffer = document.getElementById('treffer');
  var leer = document.getElementById('leer');
  /* Der Auszug wird als HTML gesetzt, damit die Fundstelle leuchten kann.
     Seit der Kunde selbst Unterlagen schickt, ist der Titel sein Text —
     also erst entschärfen, dann die Marke hineinsetzen, nie umgekehrt. */
  function zahm(t){
    return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function markiere(text, wort){
    var i = text.toLowerCase().indexOf(wort.toLowerCase());
    if (i === -1) return null;
    var von = Math.max(0, i - 60), bis = Math.min(text.length, i + wort.length + 90);
    var stück = (von > 0 ? '… ' : '') + text.slice(von, bis) + (bis < text.length ? ' …' : '');
    /* Erst im Rohtext merken, dann entschärfen, dann die Merkzeichen zu
       Markierungen machen. Andersherum schnitte eine Suche nach „amp" mitten
       in ein &amp; hinein. */
    var merk = stück.replace(new RegExp('(' + wort.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '\u0001$1\u0002');
    return zahm(merk).replace(/\u0001/g, '<mark>').replace(/\u0002/g, '</mark>');
  }
  feld.addEventListener('input', filtere);
  function filtere(){
    if (!feld) return; /* beim Ankommen steht das Feld noch nicht */
    var wort = feld.value.trim();
    var gefunden = 0;
    DOKUMENTE.forEach(function(dok){
      var auszug = dok.el.querySelector('.auszug');
      var titelEl = dok.el.querySelector('.titel');
      if (!wort) {
        dok.el.classList.remove('versteckt');
        auszug.hidden = true;
        titelEl.textContent = dok.titel;
        gefunden++;
        return;
      }
      var imTitel = markiere(dok.titel, wort);
      var imText = markiere(dok.text, wort);
      if (!imTitel && !imText) {
        dok.el.classList.add('versteckt');
        return;
      }
      gefunden++;
      dok.el.classList.remove('versteckt');
      titelEl.innerHTML = imTitel || zahm(dok.titel);
      if (imText) { auszug.innerHTML = imText; auszug.hidden = false; }
      else auszug.hidden = true;
    });
    treffer.textContent = wort ? (gefunden === 1 ? 'Ein Dokument gefunden' : gefunden + ' Dokumente gefunden') : '';
    leer.hidden = gefunden > 0;
  }
})();
</script>
<script src="rechtsfuss.js"></script>
</body>

<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dein Berater</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='10' fill='%232b5fe3'/%3E%3C/svg%3E">
<style>
/* quoroai-plattform-design · Das Gespräch baut den Raum · Marker: GESPRAECH-V15 (V14 + Kapitel falten sich wie Papier statt zuzuschnappen) */
@font-face{
  font-family:'Manrope';
  src:url('schriften/manrope.woff2') format('woff2');
  font-weight:200 800;
  font-display:swap;
}
@font-face{
  font-family:'Caveat';
  src:url('schriften/caveat.woff2') format('woff2');
  font-weight:400 700;
  font-display:swap;
}
:root{
  --papier:#fafaf7;
  --tinte:#10131a;
  --grau:#636c7d;
  --blau:#2b5fe3;
  --stift:#1d46c9;
  --linie:rgba(16,19,26,.1);
  --karte:#ffffff;
  --radius:16px;
  --feder:cubic-bezier(.22,.9,.24,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--papier);color:var(--tinte);
  font-family:'Manrope',system-ui,sans-serif;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit}
[hidden]{display:none!important}

nav{
  position:fixed;top:0;left:0;right:0;z-index:10;height:60px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 max(24px,calc((100vw - 760px)/2));
  background:linear-gradient(var(--papier) 55%, color-mix(in srgb, var(--papier) 1%, transparent));
  pointer-events:none;
}
nav .wortmarke{font-weight:800;font-size:15px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
nav .wortmarke img{height:28px;width:auto;display:block}
nav .wortmarke small{display:block;font-size:10px;font-weight:500;color:var(--grau)}
nav .wortmarke small[role="button"]{pointer-events:auto;cursor:pointer}
nav .wortmarke small[role="button"]:hover{color:var(--blau)}
nav .hinweis{font-size:12px;color:var(--grau)}
#akte-griff{
  pointer-events:auto;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;
  padding:8px 16px;border-radius:999px;border:0.5px solid var(--linie);
  background:#fff;font-size:13px;font-weight:700;color:var(--tinte);
  box-shadow:0 4px 16px rgba(16,19,26,.07);
}
#akte-griff .zahl{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:18px;height:18px;padding:0 5px;border-radius:999px;
  background:var(--blau);color:#fff;font-size:11px;font-weight:800;
}
#akte-griff[data-zahl="0"]{display:none}

/* Das Regal */
#regal{
  position:fixed;inset:0;z-index:20;overflow-y:auto;
  background:color-mix(in srgb, var(--papier) 92%, transparent);
  backdrop-filter:blur(18px) saturate(160%);
  -webkit-backdrop-filter:blur(18px) saturate(160%);
  opacity:0;pointer-events:none;transition:opacity .35s ease;
}
#regal.offen{opacity:1;pointer-events:auto}
#regal .innen{max-width:1060px;margin:0 auto;padding:96px 24px 96px}
#regal h2{font-size:clamp(26px,4vw,36px);font-weight:800;letter-spacing:-.03em}
#regal .unter{color:var(--grau);font-size:15px;margin-top:4px}
#regal h3{
  font-size:13px;font-weight:800;text-transform:none;color:var(--grau);
  margin:36px 0 4px;
}
#regal .brett{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:14px;margin-top:10px;
}
#regal .brett .karte{margin-top:0;border-color:var(--linie);box-shadow:0 8px 24px rgba(16,19,26,.06)}
#regal .brett .karte .inhalt-k{opacity:1;filter:none;transform:none}
#regal .leer{color:var(--grau);font-size:15px;margin-top:24px}
#regal .karte{pointer-events:none}
#regal-zu{
  position:fixed;top:16px;right:max(24px,calc((100vw - 1060px)/2));z-index:21;
  padding:10px 18px;border-radius:999px;border:0.5px solid var(--linie);
  background:#fff;font-size:14px;font-weight:700;cursor:pointer;
  box-shadow:0 4px 16px rgba(16,19,26,.1);
}
body.regal-offen{overflow:hidden}
@media (max-width:700px){
  #regal .brett{grid-template-columns:1fr}
}

#akte{
  position:relative;
  max-width:760px;margin:0 auto;
  padding:112px 24px 180px;
}

/* Stift-Ebene: je Kapitel eine Zeichen-Lage, klappt mit dem Kapitel zu */
.kapitel{position:relative}
.stift-lage{
  position:absolute;left:0;top:0;
  pointer-events:none;z-index:6;overflow:visible;
}
.kapitel.zu .stift-lage{display:none}
.stift-strich{
  fill:none;stroke:var(--stift);stroke-width:2.5;
  stroke-linecap:round;stroke-linejoin:round;opacity:.8;
}
.stift-notiz{
  font-family:'Caveat',cursive;font-size:23px;font-weight:700;
  fill:var(--stift);opacity:.92;
}
.merk{font-weight:800}

/* Begrüßung */
#gruss .anstrich{
  width:96px;height:12px;display:block;overflow:visible;margin-bottom:18px;
}
#gruss .anstrich path{
  fill:none;stroke:var(--stift);stroke-width:2.5;stroke-linecap:round;opacity:.85;
}
#gruss .vorgruss{
  font-family:'Caveat',cursive;font-size:clamp(22px,3.5vw,30px);font-weight:700;
  color:var(--stift);min-height:1.2em;margin-bottom:6px;
  opacity:0;translate:0 6px;rotate:-1.5deg;
  transition:opacity .6s ease,translate .6s var(--feder);
}
#gruss .vorgruss.da{opacity:.92;translate:none}
#gruss h1{
  font-size:clamp(30px,5vw,46px);font-weight:800;letter-spacing:-.03em;line-height:1.15;
  min-height:1.2em;
}
#gruss h1 .caret{
  display:inline-block;width:2px;height:.95em;background:var(--blau);
  vertical-align:-.12em;margin-left:2px;
  animation:blinzeln 1.05s steps(1) infinite;
}
@keyframes blinzeln{50%{opacity:0}}

/* Kapitel */
.kapitel{margin-top:56px}
.kapitel .frage{
  font-size:clamp(22px,3.4vw,30px);font-weight:800;letter-spacing:-.025em;line-height:1.2;
  padding-top:24px;border-top:1px solid var(--linie);
  cursor:default;
}
.kapitel.zu .frage{cursor:pointer;color:var(--grau);font-size:17px;padding:16px 0;transition:color .2s}
.kapitel.zu .frage:hover{color:var(--tinte)}
.kapitel.zu .frage::after{content:' +';color:var(--blau)}
.kapitel.zu .lauf{display:none}
.kapitel p.antwort{
  margin-top:20px;font-size:17px;color:var(--tinte);max-width:60ch;
}
.kapitel p.antwort .wort{opacity:0;filter:blur(4px);transition:opacity .32s ease,filter .32s ease}
.kapitel p.antwort .wort.da{opacity:1;filter:blur(0)}
.kapitel p.antwort .wort.fest{filter:none;transition:none}
.kapitel p.antwort.aktiv::after{
  content:'';display:inline-block;width:7px;height:7px;border-radius:999px;
  background:var(--blau);margin-left:6px;
  animation:atmen 1.15s ease-in-out infinite;
}
@keyframes atmen{0%,100%{opacity:.25;transform:scale(.75)}50%{opacity:.95;transform:scale(1)}}
.kapitel p.antwort.fehl{color:#a06008;font-size:14px}
#hirn-lampe{
  display:none;align-items:center;gap:6px;
  font-size:11px;font-weight:700;color:var(--blau);
}
#hirn-lampe::before{content:'';width:7px;height:7px;border-radius:999px;background:var(--blau)}
body.hirn #hirn-lampe{display:inline-flex}

/* Denkspur: der Stift denkt sichtbar nach */
.denken{
  display:flex;align-items:center;gap:18px;margin-top:22px;height:72px;
  opacity:0;translate:0 8px;
  transition:opacity .32s ease,translate .32s var(--feder),height .32s var(--feder),margin-top .32s var(--feder);
}
.denken.da{opacity:1;translate:none}
.denken.weg{opacity:0;translate:0 -8px;height:0;margin-top:0;overflow:hidden}
.denken svg{width:220px;height:72px;flex-shrink:0;overflow:visible}
.denken svg .strichlein{fill:none;stroke:var(--stift);stroke-linecap:round;stroke-linejoin:round}
.denken svg .punkt{fill:var(--stift)}
.denken svg .ringlein{fill:none;stroke:var(--stift)}
.denken svg .zart{fill:none;stroke:var(--stift);opacity:.13}
.denken svg text{fill:var(--stift);font-family:'Manrope',sans-serif}
.denk-text{
  font-size:14px;font-weight:600;
  background:linear-gradient(90deg,var(--grau) 35%,var(--blau) 50%,var(--grau) 65%);
  background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:denk-schimmer 2.4s linear infinite;
  transition:opacity .26s ease;
}
@keyframes denk-schimmer{from{background-position:120% 0}to{background-position:-120% 0}}

/* Karten & Materialisierung */
.reihe{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}
.reihe.zweier{grid-template-columns:repeat(2,1fr)}
.reihe.eins-zwei{grid-template-columns:1.3fr 1fr}
.karte{
  position:relative;
  background:var(--karte);
  border:0.5px solid transparent;
  border-radius:var(--radius);
  padding:18px 20px;
  margin-top:20px;
}
.reihe .karte{margin-top:0}
.karte .inhalt-k{
  opacity:0;filter:blur(7px);transform:translateY(6px);
  transition:opacity .45s ease,filter .45s ease,transform .45s var(--feder);
}
.karte.belichtet{
  border-color:var(--linie);
  box-shadow:0 10px 30px rgba(16,19,26,.06);
  transition:border-color .5s ease,box-shadow .7s ease;
}
.karte.belichtet .inhalt-k{opacity:1;filter:blur(0);transform:none}
.karte .blaupause-gitter{
  position:absolute;inset:0;border-radius:var(--radius);
  background:
    linear-gradient(color-mix(in srgb, var(--blau) 7%, transparent) 1px, transparent 1px),
    linear-gradient(90deg, color-mix(in srgb, var(--blau) 7%, transparent) 1px, transparent 1px);
  background-size:14px 14px;
  opacity:1;transition:opacity .6s ease;pointer-events:none;
}
.karte.belichtet .blaupause-gitter{opacity:0}
.karte svg.umriss{
  position:absolute;inset:0;width:100%;height:100%;
  pointer-events:none;overflow:visible;
}
.karte svg.umriss rect{
  fill:none;stroke:var(--blau);stroke-width:1.5;
  stroke-dasharray:100;stroke-dashoffset:100;
  transition:stroke-dashoffset .5s var(--feder),opacity .5s ease .45s;
}
.karte.zeichnet svg.umriss rect{stroke-dashoffset:0}
.karte.belichtet svg.umriss rect{opacity:0}

.karte .wert{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.karte .label{font-size:12.5px;color:var(--grau);margin-top:2px}
.karte .delta{font-size:12px;font-weight:700;color:var(--blau);margin-top:6px}
.karte .delta.amber{color:#a06008}

.pill{
  display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;
  font-size:12px;font-weight:700;
}
.pill-blau{background:color-mix(in srgb, var(--blau) 10%, transparent);color:var(--blau)}

/* Hero-Zahl */
.karte.gross{padding:28px 28px 24px}
.karte.gross .wert{font-size:clamp(44px,8vw,64px);line-height:1.05;color:var(--blau)}
.karte.gross .label{font-size:14px;margin-top:6px}

/* Hebel */
.hebel h3{font-size:16px;font-weight:800;letter-spacing:-.01em}
.hebel .impact{font-size:22px;font-weight:800;color:var(--blau);margin-top:8px;font-variant-numeric:tabular-nums}
.hebel .notiz-t{font-size:13px;color:var(--grau);margin-top:4px}
.hebel .empfohlen-pill{margin-bottom:10px}

/* Diagramme */
.karte svg.dia{width:100%;height:auto;display:block}
.karte svg.dia text{font-family:'Manrope',sans-serif;fill:var(--grau)}
.karte svg.dia text.tinte-t{fill:var(--tinte)}
.karte svg.dia circle.punkt{fill:var(--blau)}
.karte svg.dia .linie{fill:none;stroke:var(--blau);stroke-width:2.5;stroke-dasharray:620;stroke-dashoffset:620}
.karte.belichtet svg.dia .linie{transition:stroke-dashoffset 1.3s .2s var(--feder);stroke-dashoffset:0}
.karte svg.dia .flaeche{fill:url(#kv);opacity:0}
.karte.belichtet svg.dia .flaeche{transition:opacity .8s 1.1s ease;opacity:.3}
.karte svg.dia rect.balken{transform:scaleY(0);transform-box:fill-box;transform-origin:center bottom}
.karte.belichtet svg.dia rect.balken{transform:scaleY(1);transition:transform .7s var(--feder)}
.karte svg.dia .verbinder{stroke:rgba(16,19,26,.25);stroke-dasharray:3 3}
.karte svg.dia .linie-fp{fill:none;stroke:var(--blau);stroke-width:2.5;stroke-dasharray:460;stroke-dashoffset:460}
.karte.belichtet svg.dia .linie-fp{transition:stroke-dashoffset 1s .2s var(--feder);stroke-dashoffset:0}
@media (prefers-reduced-motion: reduce){
  .karte svg.dia .linie-fp,.karte.belichtet svg.dia .linie-fp{stroke-dashoffset:0;transition:none}
}
.karte svg.dia circle.punkt{transform:scale(0);transform-box:fill-box;transform-origin:center}
.karte.belichtet svg.dia circle.punkt{transform:scale(1);transition:transform .4s var(--feder)}
.karte svg.dia .ring{fill:none;stroke:rgba(16,19,26,.08);stroke-width:14}
.karte svg.dia .bogen{fill:none;stroke:var(--blau);stroke-width:14;stroke-linecap:round}

/* Rechenweg */
.formel .zeile-f{
  display:flex;align-items:baseline;gap:10px;
  font-size:15px;padding:7px 0;
  opacity:0;translate:0 6px;
}
.karte.belichtet .formel .zeile-f{opacity:1;translate:none;transition:opacity .5s ease,translate .5s var(--feder)}
.formel .op{width:18px;color:var(--grau);font-weight:700;text-align:center;flex-shrink:0}
.formel .fuellung{flex:1;border-bottom:1.5px dotted rgba(16,19,26,.2);translate:0 -4px}
.formel .wert-f{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.formel .zeile-f.ergebnis{border-top:1.5px solid var(--tinte);margin-top:6px;padding-top:12px;font-size:17px}
.formel .zeile-f.ergebnis .wert-f{color:var(--blau);font-size:20px}

/* Vergleich */
.vergleich{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center}
.vergleich .seite .label{margin-top:0;margin-bottom:4px}
.vergleich .seite .wert{font-size:30px}
.vergleich .dazwischen{font-size:28px;color:var(--blau);font-weight:800}

/* Dokument */
.dokument{display:flex;align-items:center;gap:16px}
.dokument .blatt{
  width:40px;height:52px;flex-shrink:0;position:relative;
  background:#fff;border:1px solid var(--linie);border-radius:4px;
}
.dokument .blatt::before{
  content:'';position:absolute;right:-1px;top:-1px;
  border:9px solid transparent;
  border-left-color:color-mix(in srgb, var(--blau) 25%, transparent);border-bottom-color:color-mix(in srgb, var(--blau) 25%, transparent);
  border-radius:0 0 0 4px;
}
.dokument .blatt::after{
  content:'';position:absolute;left:7px;right:7px;top:16px;height:22px;
  background:linear-gradient(var(--linie) 1.5px, transparent 1.5px);
  background-size:100% 7px;
}
.dokument .name{font-weight:800;font-size:15px}
.dokument .meta{font-size:12.5px;color:var(--grau)}

/* Dokument öffnen: die Karte ist ein Griff, kein Bild */
.karte[data-doku],.karte[data-bild]{cursor:pointer}
#regal .karte[data-bild]{pointer-events:auto}
.karte[data-bild].belichtet:hover{translate:0 -2px;box-shadow:0 14px 34px rgba(16,19,26,.1)}
.karte[data-bild].belichtet{transition:border-color .5s ease,box-shadow .25s ease,translate .25s var(--feder)}
.karte[data-doku] .dokument::after{
  content:'›';margin-left:auto;padding-left:12px;
  font-size:24px;font-weight:600;color:var(--grau);
  transition:color .2s ease,translate .2s var(--feder);
}
.karte[data-doku]:hover .dokument::after{color:var(--blau);translate:3px 0}
.karte[data-doku].belichtet{transition:border-color .5s ease,box-shadow .25s ease,translate .25s var(--feder)}
.karte[data-doku].belichtet:hover{translate:0 -2px;box-shadow:0 14px 34px rgba(16,19,26,.1)}
#regal .karte[data-doku]{pointer-events:auto}

/* Der Blatt-Blick: das Dokument zieht sich aus der Karte groß */
#blatt-blick{
  position:fixed;inset:0;z-index:24;overflow-y:auto;
  background:color-mix(in srgb, var(--tinte) 16%, transparent);
  backdrop-filter:blur(10px) saturate(120%);
  -webkit-backdrop-filter:blur(10px) saturate(120%);
  opacity:0;pointer-events:none;transition:opacity .3s ease;
}
#blatt-blick.offen{opacity:1;pointer-events:auto}
#blatt-blick .bogen{
  position:relative;max-width:680px;margin:76px auto 96px;
  background:#fff;border-radius:20px;padding:44px 48px 36px;
  box-shadow:0 30px 80px rgba(16,19,26,.28);
  translate:0 30px;scale:.96;
  transition:translate .5s var(--feder),scale .5s var(--feder);
}
#blatt-blick.offen .bogen{translate:none;scale:none}
#blatt-blick .bogen-titel{font-size:clamp(24px,3.6vw,32px);font-weight:800;letter-spacing:-.03em;line-height:1.15}
#blatt-blick .bogen-meta{font-size:13px;color:var(--grau);margin-top:6px;padding-bottom:20px;border-bottom:1px solid var(--linie)}
#blatt-blick .bogen-inhalt h4{font-size:13px;font-weight:800;color:var(--grau);margin:26px 0 6px}
#blatt-blick .bogen-inhalt p{font-size:15.5px;max-width:58ch}
#blatt-blick .bogen-inhalt table{width:100%;border-collapse:collapse;margin-top:8px;font-size:14.5px}
#blatt-blick .bogen-inhalt th{text-align:left;font-size:12px;color:var(--grau);font-weight:700;padding:6px 0;border-bottom:1px solid var(--linie)}
#blatt-blick .bogen-inhalt td{padding:9px 0;border-bottom:0.5px solid var(--linie);font-variant-numeric:tabular-nums}
#blatt-blick .bogen-inhalt td.neu{font-weight:800;color:var(--blau)}
#blatt-blick .rand-notiz{
  position:absolute;right:26px;top:34px;rotate:-3deg;
  font-family:'Caveat',cursive;font-size:22px;font-weight:700;color:var(--stift);opacity:.9;
}
#blatt-blick .bogen-fuss{
  margin-top:30px;padding-top:14px;border-top:1px solid var(--linie);
  font-size:12.5px;color:var(--grau);display:flex;justify-content:space-between;gap:12px;
}
#blatt-zu{
  position:fixed;top:16px;right:max(24px,calc((100vw - 680px)/2));z-index:25;
  padding:10px 18px;border-radius:999px;border:0.5px solid var(--linie);
  background:#fff;font-size:14px;font-weight:700;cursor:pointer;
  box-shadow:0 4px 16px rgba(16,19,26,.15);
}
body.blatt-offen{overflow:hidden}
@media (max-width:700px){
  #blatt-blick .bogen{margin:64px 12px 80px;padding:28px 22px 26px}
  #blatt-blick .rand-notiz{position:static;display:block;rotate:-2deg;margin-top:8px}
}

/* Kalender */
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.slots button{
  padding:14px 8px;border-radius:12px;border:0.5px solid var(--linie);
  background:var(--papier);font-size:14px;font-weight:700;cursor:pointer;
  transition:border-color .2s,background .2s;
}
.slots button:hover{border-color:var(--blau)}
.slots button.gewaehlt{background:var(--tinte);color:#fff;border-color:var(--tinte)}
.slots button:disabled:not(.gewaehlt){opacity:.4;cursor:default}
.kalender .wer{display:flex;align-items:center;gap:12px}
.kalender .kreis{
  width:40px;height:40px;border-radius:999px;flex-shrink:0;
  display:inline-flex;align-items:center;justify-content:center;
  background:color-mix(in srgb, var(--blau) 10%, transparent);color:var(--blau);font-weight:800;font-size:14px;
}

/* Bestätigung */
.bestaetigung{display:flex;align-items:center;gap:16px}
.bestaetigung svg{width:44px;height:44px;flex-shrink:0}
.bestaetigung svg circle{fill:none;stroke:var(--blau);stroke-width:2.5;stroke-dasharray:126;stroke-dashoffset:126}
.bestaetigung svg path{fill:none;stroke:var(--blau);stroke-width:3.5;stroke-linecap:round;stroke-dasharray:36;stroke-dashoffset:36}
.karte.belichtet .bestaetigung svg circle{animation:ziehen .6s .1s ease forwards}
.karte.belichtet .bestaetigung svg path{animation:ziehen .4s .55s ease forwards}
@keyframes ziehen{to{stroke-dashoffset:0}}

/* Chips + Eingabe */
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.chips button{
  padding:10px 18px;border-radius:999px;border:0.5px solid var(--linie);
  background:#fff;font-size:14px;font-weight:600;cursor:pointer;

#eingabe{

<script>
(function(){
  'use strict';
  var reduziert = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var akte = document.getElementById('akte');
  var beschaeftigt = false;

  function warte(ms){ return new Promise(function(f){ setTimeout(f, reduziert ? 0 : ms); }); }

  /* Kamera-Folge: gleitet beim Schreiben ruhig mit, statt zu springen.
     Scrollt der Leser nach oben, lässt sie los; unten angekommen greift sie wieder. */
  var kamera = (function(){
    var an = false, folgt = true, letzte = 0, beruehrY = null;
    function nahUnten(){ return window.innerHeight + window.scrollY >= document.body.scrollHeight - 160; }
    window.addEventListener('wheel', function(e){ if (an && e.deltaY < 0) folgt = false; }, {passive:true});
    window.addEventListener('touchstart', function(e){ beruehrY = e.touches[0].clientY; }, {passive:true});
    window.addEventListener('touchmove', function(e){
      if (an && beruehrY !== null && e.touches[0].clientY > beruehrY + 8) folgt = false;
    }, {passive:true});
    window.addEventListener('scroll', function(){ if (an && !folgt && nahUnten()) folgt = true; }, {passive:true});
    function tick(t){
      if (!an) return;
      var dt = Math.min((t - letzte) / 1000, .05); letzte = t;
      if (folgt) {
        var ziel = document.body.scrollHeight - window.innerHeight;
        var d = ziel - window.scrollY;
        if (d > 0.5) window.scrollTo(0, window.scrollY + d * Math.min(1, dt * 4.5));
      }
      requestAnimationFrame(tick);
    }
    return {
      laeuft: function(){ return an; },
      start: function(){
        if (an || reduziert) return;
        an = true; folgt = true; letzte = performance.now();
        document.documentElement.style.scrollBehavior = 'auto';
        requestAnimationFrame(tick);
      },
      halt: function(){
        an = false;
        document.documentElement.style.scrollBehavior = '';
      }
    };
  })();

  function runter(){
    if (reduziert || kamera.laeuft()) return;
    window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'});
  }
  function euro(n){ return n.toLocaleString('de-DE') + ' €'; }
  function zufall(a, b){ return a + Math.random() * (b - a); }
  function groesse(b){
    if (b >= 1048576) return (b / 1048576).toFixed(1).replace('.', ',') + ' MB';
    return Math.max(1, Math.round(b / 1024)) + ' kB';
  }
  /* Schreibkosten eines Worts in Takt-Einheiten: Satzzeichen kaufen sich eine Atempause */
  function wortKosten(text){
    if (/[.!?…]["“”)]*\s*$/.test(text)) return 4.2;
    if (/[:;,]["“”)]*\s*$/.test(text)) return 2.1;
    return 1;
  }
  function glatt(punkte){
    var d = 'M' + punkte[0][0].toFixed(1) + ' ' + punkte[0][1].toFixed(1);
    for (var i = 1; i < punkte.length - 1; i++) {
      var mx = (punkte[i][0] + punkte[i+1][0]) / 2, my = (punkte[i][1] + punkte[i+1][1]) / 2;
      d += ' Q' + punkte[i][0].toFixed(1) + ' ' + punkte[i][1].toFixed(1) + ' ' + mx.toFixed(1) + ' ' + my.toFixed(1);
    }
    return d;
  }

  /* ---------- Stift-Ebene: die KI zeichnet ---------- */
  var NS = 'http://www.w3.org/2000/svg';
  var stift = (function(){
    function lage(kapitel){
      var svg = kapitel.querySelector(':scope > .stift-lage');
      if (!svg) {
        svg = document.createElementNS(NS, 'svg');
        svg.setAttribute('class', 'stift-lage');
        kapitel.appendChild(svg);
      }
      svg.setAttribute('width', kapitel.offsetWidth);
      svg.setAttribute('height', kapitel.offsetHeight);
      return svg;
    }
    function ref(el, kapitel){
      var a = kapitel.getBoundingClientRect(), r = el.getBoundingClientRect();
      return {x: r.left - a.left, y: r.top - a.top, w: r.width, h: r.height};
    }
    function strich(kapitel, d, dauer, breite){
      var svg = lage(kapitel);
      var p = document.createElementNS(NS, 'path');
      p.setAttribute('d', d);
      p.setAttribute('class', 'stift-strich');
      if (breite) p.setAttribute('stroke-width', breite);
      svg.appendChild(p);
      if (reduziert) return Promise.resolve();
      var len = p.getTotalLength();
      p.style.strokeDasharray = len;
      p.style.strokeDashoffset = len;
      p.style.transition = 'stroke-dashoffset ' + dauer + 'ms cubic-bezier(.45,.05,.55,.95)';
      void p.getBoundingClientRect();
      p.style.strokeDashoffset = 0;
      return new Promise(function(f){ setTimeout(f, dauer + 60); });
    }
    async function kreis(kapitel, el){
      var b = ref(el, kapitel), cx = b.x + b.w/2, cy = b.y + b.h/2;
      var rx = b.w/2 + zufall(8, 16), ry = b.h/2 + zufall(6, 12);
      var start = zufall(0, Math.PI*2), runden = zufall(1.05, 1.2);
      var n = Math.round(16 * runden), pts = [];
      for (var i = 0; i <= n; i++) {
        var a = start + i/n * Math.PI*2*runden;
        pts.push([cx + Math.cos(a) * (rx + zufall(-4, 5)), cy + Math.sin(a) * (ry + zufall(-3, 4))]);
      }
      await strich(kapitel, glatt(pts), 650);
    }
    async function unterstreich(kapitel, el){
      /* Zeile für Zeile: eine umbrochene Merk-Stelle bekommt je Zeile ihren
         eigenen Strich, statt einer Linie quer über den Absatz-Kasten */
      var a = kapitel.getBoundingClientRect();
      var zeilen = Array.prototype.slice.call(el.getClientRects());
      if (!zeilen.length) return;
      for (var z = 0; z < zeilen.length; z++) {
        var b = {x: zeilen[z].left - a.left, y: zeilen[z].top - a.top, w: zeilen[z].width, h: zeilen[z].height};
        if (b.w < 8) continue;
        var y = b.y + b.h + zufall(-2, 1);
        var n = 6, pts = [];
        for (var i = 0; i <= n; i++) pts.push([b.x - 2 + (b.w + 5) * i/n, y + zufall(-1.5, 2.5)]);
        await strich(kapitel, glatt(pts), Math.max(220, Math.min(380, 380 * b.w / 300)), 2.5);
      }
    }
    async function pfeil(kapitel, vonEl, nachEl){
      var a = ref(vonEl, kapitel), b = ref(nachEl, kapitel);
      var x1 = a.x + a.w/2, y1 = a.y + a.h + 4, x2 = b.x + b.w/2, y2 = b.y - 8;
      if (y2 < y1 + 30) { x1 = a.x + a.w + 4; y1 = a.y + a.h/2; x2 = b.x - 8; y2 = b.y + b.h/2; }
      var mx = (x1 + x2)/2 + zufall(-34, 34), my = (y1 + y2)/2 + zufall(-18, 18);
      await strich(kapitel, 'M' + x1 + ' ' + y1 + ' Q' + mx + ' ' + my + ' ' + x2 + ' ' + y2, 520);
      var ang = Math.atan2(y2 - my, x2 - mx), l = 11;
      await strich(kapitel,
        'M' + (x2 - Math.cos(ang - 0.5) * l) + ' ' + (y2 - Math.sin(ang - 0.5) * l) +
        ' L' + x2 + ' ' + y2 +
        ' L' + (x2 - Math.cos(ang + 0.5) * l) + ' ' + (y2 - Math.sin(ang + 0.5) * l), 180);
    }
    function notiz(kapitel, el, text, wo){
      /* Eine Notiz unter einem Block braucht Luft: der Block bekommt unten
         Rand, damit die Handschrift nicht im Folgetext klebt */
      if (wo === 'unten') {
        var block = el.closest('.reihe, .karte, p');
        if (block && kapitel.contains(block)) block.style.marginBottom = '36px';
      }
      var svg = lage(kapitel);
      var b = ref(el, kapitel);
      var t = document.createElementNS(NS, 'text');
      t.setAttribute('class', 'stift-notiz');
      var x, y, anker;
      if (wo === 'rechts') { x = b.x + b.w + 14; y = b.y + b.h/2 + zufall(-4, 6); anker = 'start'; }
      else if (wo === 'links') { x = b.x - 14; y = b.y + b.h/2; anker = 'end'; }
      else if (wo === 'unten') { x = b.x + b.w/2 + zufall(-24, 24); y = b.y + b.h + 26; anker = 'middle'; }
      else { x = b.x + b.w/2 + zufall(-24, 24); y = b.y - 12 + zufall(-4, 2); anker = 'middle'; }
      x = Math.max(52, Math.min(x, kapitel.offsetWidth - 52));
      t.setAttribute('x', x); t.setAttribute('y', y);
      t.setAttribute('text-anchor', anker);
      t.setAttribute('transform', 'rotate(' + zufall(-4, -1).toFixed(1) + ' ' + x + ' ' + y + ')');
      t.textContent = text;
      svg.appendChild(t);
      if (!reduziert) {
        t.style.opacity = 0;
        requestAnimationFrame(function(){ t.style.transition = 'opacity .5s ease'; t.style.opacity = 1; });
      }
      return warte(300);
    }
    return {kreis: kreis, unterstreich: unterstreich, pfeil: pfeil, notiz: notiz};
  })();

  /* ---------- Materialisierung: Blaupause wird Wirklichkeit ---------- */
  function aktualisiereGriff(){
    var griff = document.getElementById('akte-griff');
    var n = document.querySelectorAll('#akte .karte').length;
    griff.dataset.zahl = String(n);
    griff.querySelector('.zahl').textContent = String(n);
  }

  function materialisiere(karte){
    aktualisiereGriff();
    return new Promise(function(fertig){
      if (reduziert) { karte.classList.add('zeichnet','belichtet'); fertig(); return; }
      var gitter = document.createElement('div');
      gitter.className = 'blaupause-gitter';
      karte.appendChild(gitter);
      var svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('class', 'umriss');
      var r = document.createElementNS(NS, 'rect');
      var b = karte.getBoundingClientRect();
      r.setAttribute('x', 1); r.setAttribute('y', 1);
      r.setAttribute('width', Math.max(b.width - 2, 2));
      r.setAttribute('height', Math.max(b.height - 2, 2));
      r.setAttribute('rx', 15);
      r.setAttribute('pathLength', 100);
      svg.appendChild(r);
      karte.appendChild(svg);
      void r.getBoundingClientRect();
      karte.classList.add('zeichnet');
      setTimeout(function(){ karte.classList.add('belichtet'); }, 480);
      setTimeout(function(){ svg.remove(); gitter.remove(); fertig(); }, 1150);
    });
  }

  function zaehleHoch(el, ziel, format){
    if (reduziert) { el.textContent = format(ziel); return; }
    var start = null;
    function tick(t){
      if (!start) start = t;
      var p = Math.min((t - start) / 900, 1);
      el.textContent = format(ziel * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }
  function ganz(f){ return function(n){ return f(Math.round(n)); }; }

  /* ---------- Text-Strom mit Merk-Stellen (*so*) ---------- */
  function stroeme(kapitel, text, marken){
    return new Promise(function(fertig){
      var p = document.createElement('p');
      p.className = 'antwort';
      kapitel.querySelector('.lauf').appendChild(p);
      var teile = text.split('*');
      var markenIndex = 0;
      if (reduziert) {
        teile.forEach(function(teil, idx){
          if (idx % 2 === 0) { p.appendChild(document.createTextNode(teil)); return; }
          var m = document.createElement('span');
          m.className = 'merk';
          if (marken && marken[markenIndex]) m.dataset.sk = marken[markenIndex];
          markenIndex++;
          m.textContent = teil;
          p.appendChild(m);
        });
        fertig(); return;
      }
      var plan = [];
      teile.forEach(function(teil, idx){
        var gruppe = null;
        if (idx % 2 === 1) {
          gruppe = {sk: (marken && marken[markenIndex]) || null};
          markenIndex++;
        }
        (teil.match(/\S+\s*/g) || []).forEach(function(stueck){
          plan.push({wort: stueck, gruppe: gruppe});
        });
      });
      /* Gleitender Takt: Tempo in Wörtern je Sekunde, stufenlos angefahren.
         Satzzeichen kosten mehr Takt-Einheiten und atmen so von selbst. */
      p.classList.add('aktiv');
      var i = 0, offeneGruppe = null, huelle = null;
      function zeige(eintrag){
        if (eintrag.gruppe !== offeneGruppe) {
          offeneGruppe = eintrag.gruppe;
          if (offeneGruppe) {
            huelle = document.createElement('span');
            huelle.className = 'merk';
            if (offeneGruppe.sk) huelle.dataset.sk = offeneGruppe.sk;
            p.appendChild(huelle);
          } else {
            huelle = null;
          }
        }
        var s = document.createElement('span');
        s.className = 'wort';
        s.textContent = eintrag.wort;
        (huelle || p).appendChild(s);
        requestAnimationFrame(function(){ s.classList.add('da'); });
        s.addEventListener('transitionend', function(){ s.classList.add('fest'); }, {once:true});
      }
      var rate = 6, guthaben = 0, letzte = performance.now();
      function tick(t){
        var dt = Math.min((t - letzte) / 1000, .08); letzte = t;
        rate += (19 - rate) * Math.min(1, dt / 0.45);
        guthaben += rate * dt;
        while (i < plan.length) {
          var k = wortKosten(plan[i].wort);
          if (guthaben < k) break;
          guthaben -= k;
          zeige(plan[i]); i++;
        }
        if (i >= plan.length) { p.classList.remove('aktiv'); fertig(); return; }

  function baueWasserfall(d){
    var laufend = [d.start.wert], namen = [d.start.name], werte = [d.start.wert], arten = ['fest'];

    });
    namen.push(d.ende); werte.push(laufend[laufend.length-1]); arten.push('fest');
    var alle = laufend.concat([d.start.wert]);
    var min = Math.min.apply(null, alle) - 1.5, max = Math.max.apply(null, alle) + 1;
    var H = 200, oben = 26, unten = 42, links = 10;
    var skala = (H - oben - unten) / (max - min);
    function yVon(v){ return H - unten - (v - min) * skala; }
    var n = namen.length, bw = Math.min(88, (600 - 2*links) / n - 18);
    var svgTeile = [];
    var vorher = null;
    for (var i = 0; i < n; i++) {

      if (arten[i] === 'fest') {

        top = yVon(v); hoehe = yVon(min) - top; farbe = 'color-mix(in srgb, var(--blau) 85%, transparent)';

  /* ---------- Denkspur: der Stift denkt sichtbar nach ---------- */
  function zeigeDenken(kapitel){
    var lauf = kapitel.querySelector('.lauf');
    var box = document.createElement('div');
    box.className = 'denken';
    if (reduziert) {
      var still = document.createElement('span');
      still.className = 'denk-text';
      still.textContent = 'Denkt nach …';
      box.appendChild(still);
      box.classList.add('da');
      lauf.appendChild(box);
      return { weg: function(){ box.remove(); return Promise.resolve(); } };
    }
    var svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 220 72');
    svg.setAttribute('aria-hidden', 'true');
    var wort = document.createElement('span');
    wort.className = 'denk-text';
    box.appendChild(svg); box.appendChild(wort);
    lauf.appendChild(box);
    requestAnimationFrame(function(){ box.classList.add('da'); });
    var lebt = true;

    var saetze = ['Liest deine Zahlen …', 'Zerlegt die Frage …', 'Rechnet nach …', 'Prüft den Rechenweg …', 'Wägt die Hebel ab …', 'Skizziert die Antwort …'];
    var idx = Math.floor(zufall(0, saetze.length));
    wort.textContent = saetze[idx];
    var wechsel = setInterval(function(){
      if (!lebt) return;
      wort.style.opacity = 0;
      setTimeout(function(){
        if (!lebt) return;
        idx = (idx + 1) % saetze.length;
        wort.textContent = saetze[idx];
        wort.style.opacity = 1;
      }, 260);
    }, 2600);

    /* Neun lebende Szenen — alle pulsieren dauerhaft, pro Frage eine andere,
       bei langem Nachdenken wechseln sie mit Überblendung durch. */
    var W = 220, H = 72, MX = W / 2, MY = H / 2;
    function el(name, attrs, ziel){
      var e = document.createElementNS(NS, name);
      for (var k in attrs) e.setAttribute(k, attrs[k]);
      ziel.appendChild(e);
      return e;
    }
    /* Tinten-Sonar: ein Kern atmet, Ringe laufen hinaus */
    function sonar(g){
      var kern = el('circle', {cx:MX, cy:MY, r:5, 'class':'punkt'}, g);
      var ringe = [], naechster = 0;
      return function(t){
        kern.setAttribute('r', 5 + Math.sin(t * 3.1) * 1.6);
        if (t >= naechster) { ringe.push({e: el('circle', {cx:MX, cy:MY, r:6, 'class':'ringlein'}, g), start: t}); naechster = t + .8; }
        for (var i = ringe.length - 1; i >= 0; i--) {
          var a = (t - ringe[i].start) / 1.9;
          if (a >= 1) { ringe[i].e.remove(); ringe.splice(i, 1); continue; }
          ringe[i].e.setAttribute('r', 6 + a * 27);
          ringe[i].e.setAttribute('stroke-width', 2.2 * (1 - a) + .3);
          ringe[i].e.setAttribute('opacity', .55 * (1 - a));
        }
      };
    }
    /* Kreisende Gedanken: drei Punkte auf Bahnen, verschieden schnell */
    function orbit(g){
      var bahnen = [{rx:34, ry:10, v:1.4, r:3.4}, {rx:58, ry:16, v:-.85, r:3}, {rx:82, ry:23, v:.55, r:2.6}];
      bahnen.forEach(function(b){
        el('ellipse', {cx:MX, cy:MY, rx:b.rx, ry:b.ry, 'class':'zart', 'stroke-width':1}, g);
        b.e = el('circle', {cx:MX, cy:MY, r:b.r, 'class':'punkt'}, g);
        b.ph = zufall(0, 6.28);
      });
      var kern = el('circle', {cx:MX, cy:MY, r:4.5, 'class':'punkt'}, g);
      return function(t){
        kern.setAttribute('r', 4.5 + Math.sin(t * 2.6) * 1.2);
        bahnen.forEach(function(b){
          var a = b.ph + t * b.v;
          b.e.setAttribute('cx', MX + Math.cos(a) * b.rx);
          b.e.setAttribute('cy', MY + Math.sin(a) * b.ry);
          b.e.setAttribute('r', b.r * (1 + .25 * Math.sin(t * 3 + b.ph)));
        });
      };
    }
    /* Punktschwarm: eine Welle läuft durch den Ring */
    function schwarm(g){
      var punkte = [], N = 18, R = 26;
      for (var i = 0; i < N; i++) {
        var a = i / N * Math.PI * 2;
        punkte.push({e: el('circle', {cx: MX + Math.cos(a) * R * 1.9, cy: MY + Math.sin(a) * R * .58, r:2.2, 'class':'punkt'}, g), ph: a});
      }
      return function(t){
        punkte.forEach(function(p){
          var s = .5 + .5 * Math.sin(t * 3.4 - p.ph * 2);
          p.e.setAttribute('r', 1.8 + s * 2.6);
          p.e.setAttribute('opacity', .35 + s * .65);
        });
      };
    }
    /* Fließende Doppelwelle, Amplitude atmet */
    function fliesswelle(g){
      var p1 = el('path', {'class':'strichlein', 'stroke-width':2.4}, g);
      var p2 = el('path', {'class':'strichlein', 'stroke-width':2, opacity:.3}, g);
      function bahn(t, ph, amp){
        var d = 'M8 ' + MY;
        for (var x = 8; x <= W - 8; x += 4) d += ' L' + x + ' ' + (MY + amp * Math.sin(x / 16 - t * 3.4 + ph)).toFixed(1);
        return d;
      }
      return function(t){
        var amp = 8 + 5 * Math.sin(t * 1.4);
        p1.setAttribute('d', bahn(t, 0, amp));
        p2.setAttribute('d', bahn(t, 1.9, amp * .7));
      };
    }
    /* Tanzende Balken: der Berater rechnet hörbar */
    function balken(g){
      var st = [], N = 7, abst = 17, x0 = MX - (N - 1) / 2 * abst;
      for (var i = 0; i < N; i++) {
        st.push({e: el('line', {x1: x0 + i * abst, x2: x0 + i * abst, y1: MY, y2: MY, 'class':'strichlein', 'stroke-width':7}, g), ph: i * .85});
      }
      return function(t){
        st.forEach(function(s, i){
          var h = 5 + 11 * Math.abs(Math.sin(t * 2.3 + s.ph)) + 3 * Math.sin(t * 5.1 + i);
          s.e.setAttribute('y1', MY - h);
          s.e.setAttribute('y2', MY + h);
        });
      };
    }
    /* Flimmernde Ziffern: Zahlen rasseln durch, ab und zu € und % */
    function ziffern(g){
      var pool = '0123456789012345678901234567890123456789€%';
      var slots = [], N = 4, abst = 30, x0 = MX - (N - 1) / 2 * abst;
      for (var i = 0; i < N; i++) {
        var tx = el('text', {x: x0 + i * abst, y: MY + 10, 'text-anchor':'middle', 'font-size':'28', 'font-weight':'800'}, g);
        tx.textContent = String(i * 2 + 1);
        slots.push({e: tx, naechst: zufall(0, .12), ph: i * 1.7});
      }
      return function(t){
        slots.forEach(function(s){
          if (t >= s.naechst) {

    /* Synapsen: Impulse wandern durchs Netz, Knoten blitzen auf */
    function synapsen(g){
      var kn = [[24,22],[62,56],[105,14],[118,60],[168,44],[200,18],[84,34]];
      var kanten = [[0,1],[1,6],[6,2],[6,3],[3,4],[2,4],[4,5],[2,5],[0,6]];
      kanten.forEach(function(k){
        el('line', {x1:kn[k[0]][0], y1:kn[k[0]][1], x2:kn[k[1]][0], y2:kn[k[1]][1], 'class':'zart', 'stroke-width':1.2}, g);
      });
      var kreise = kn.map(function(p){ return el('circle', {cx:p[0], cy:p[1], r:3, 'class':'punkt', opacity:.45}, g); });
      var blitz = kn.map(function(){ return -9; });
      var pulse = [], naechster = .2;
      return function(t){
        if (t >= naechster) {
          var k = kanten[Math.floor(zufall(0, kanten.length))];
          var richtung = zufall(0, 1) < .5 ? [k[1], k[0]] : k;
          pulse.push({von: kn[richtung[0]], nach: kn[richtung[1]], ziel: richtung[1], start: t, dauer: zufall(.45, .8), e: el('circle', {r:2.6, 'class':'punkt'}, g)});
          naechster = t + zufall(.25, .55);
        }
        for (var i = pulse.length - 1; i >= 0; i--) {
          var p = pulse[i], a = (t - p.start) / p.dauer;
          if (a >= 1) { p.e.remove(); blitz[p.ziel] = t; pulse.splice(i, 1); continue; }
          p.e.setAttribute('cx', p.von[0] + (p.nach[0] - p.von[0]) * a);
          p.e.setAttribute('cy', p.von[1] + (p.nach[1] - p.von[1]) * a);
        }
        kreise.forEach(function(c, i){
          var s = Math.max(0, 1 - (t - blitz[i]) / .6);
          c.setAttribute('r', 3 + s * 3);

    /* Endlos schreibende Stiftschleife: die Tinte läuft immer weiter */
    function endlosschleife(g){
      var b = 9.6, a = 5.2, pts = [];
      for (var t2 = 0; t2 <= Math.PI * 2 * 5.2; t2 += .2) {
        pts.push([16 + a * t2 - b * Math.sin(t2), MY - 2 - b * Math.cos(t2)]);
      }
      var p = el('path', {'class':'strichlein', 'stroke-width':2.4, d: glatt(pts)}, g);
      var L = p.getTotalLength(), seg = L * .3, off = 0;
      p.setAttribute('stroke-dasharray', seg + ' ' + (L - seg));
      return function(t, dt){
        off -= dt * 95;
        p.setAttribute('stroke-dashoffset', off);
        p.setAttribute('stroke-width', 2.1 + .7 * Math.sin(t * 2.8));
      };
    }
    /* Skizzierter Kreisel: ein handgezeichneter Ring dreht und atmet */
    function kreisel(g){
      var pts = [], n = 26;
      for (var i = 0; i <= n; i++) {
        var a = i / n * Math.PI * 2;
        pts.push([MX + Math.cos(a) * (21 + zufall(-1.5, 1.5)), MY + Math.sin(a) * (17 + zufall(-1.5, 1.5))]);
      }
      var p = el('path', {'class':'strichlein', 'stroke-width':2.6, d: glatt(pts) + 'Z'}, g);
      var L = p.getTotalLength(), seg = L * .62, off = 0;
      return function(t, dt){

        p.setAttribute('stroke-width', 2 + .8 * Math.sin(t * 3.2));

    var SZENEN = [sonar, orbit, schwarm, fliesswelle, balken, ziffern, synapsen, endlosschleife, kreisel];

    /* Gemischter Stapel: jede Szene kommt einmal dran, bevor sich eine wiederholt */
    var stapel = [], vorige = -1;
    function ziehe(){
      if (!stapel.length) {
        for (var i = 0; i < SZENEN.length; i++) stapel.push(i);
        for (var j = stapel.length - 1; j > 0; j--) {
          var z = Math.floor(zufall(0, j + 1));
          var tausch = stapel[j]; stapel[j] = stapel[z]; stapel[z] = tausch;
        }
        if (stapel[stapel.length - 1] === vorige) {

    function neueSzene(){

  function klappeZu(sec){
    if (sec.classList.contains('zu')) return;
    if (reduziert) { sec.classList.add('zu'); return; }
    var lauf = sec.querySelector('.lauf');
    var blende = lauf.animate([{opacity: 1}, {opacity: 0}], {duration: 240, easing: 'ease'});
    blende.onfinish = function(){
      var vorher = sec.offsetHeight;
      sec.classList.add('zu');
      var nachher = sec.offsetHeight;
      sec.style.overflow = 'hidden';
      var falt = sec.animate([{height: vorher + 'px'}, {height: nachher + 'px'}],
        {duration: 460, easing: 'cubic-bezier(.22,.9,.24,1)'});
      falt.onfinish = function(){ sec.style.overflow = ''; };
    };
  }
  function klappeAuf(sec){
    if (!sec.classList.contains('zu')) return;
    if (reduziert) { sec.classList.remove('zu'); return; }
    var vorher = sec.offsetHeight;
    sec.classList.remove('zu');
    var nachher = sec.offsetHeight;
    var lauf = sec.querySelector('.lauf');
    sec.style.overflow = 'hidden';
    lauf.style.opacity = '0';
    var falt = sec.animate([{height: vorher + 'px'}, {height: nachher + 'px'}],
      {duration: 500, easing: 'cubic-bezier(.22,.9,.24,1)'});
    falt.onfinish = function(){
      sec.style.overflow = '';
      var blende = lauf.animate([{opacity: 0}, {opacity: 1}], {duration: 260, easing: 'ease'});
      blende.onfinish = function(){ lauf.style.opacity = ''; };
    };

    { probe: /(mensch|termin|berater|buch|anruf|sprechen)/i,
      frage: 'Buch mir einen Menschen.',
      schritte: [
        {t: 'Gern. Für Preis und Marge ist Dr. Anna Vogelsang die Richtige. Sie hat diese Woche drei Fenster, such dir eins aus:'},
        {kalender: ['Donnerstag, 10:00', 'Donnerstag, 16:00', 'Freitag, 9:00']}
      ]}
  ];
  var SONST = {
    schritte: [
      {t: 'Verstanden. Das rechne ich in Ruhe durch und lege dir die Antwort in die Akte, mit Rechenweg. Du siehst hier, sobald sie liegt.'},
      {dokument: {name:'In Arbeit: deine Frage', meta:'Antwort entsteht · landet in deiner Akte', sk:'auftrag'}},
      {skizze: [{art:'notiz', ziel:'auftrag', text:'bis morgen früh', wo:'rechts'}]},
      {chips: ['Wie läuft mein Geschäft?', 'Warum schrumpft meine Marge?', 'Buch mir einen Menschen']}
    ]};

  function waehleSlot(karte, knopf, slot){
    if (beschaeftigt) return;
    karte.querySelectorAll('.slots button').forEach(function(b){ b.disabled = true; });
    knopf.classList.add('gewaehlt');
    var kapitel = aktuellesKapitel;
    (async function(){
      kamera.start();
      await warte(350);
      await stroeme(kapitel, 'Steht: ' + slot + ' mit Dr. Anna Vogelsang. Sie bekommt vorab, was wir hier besprochen haben.');
      var k = baueBestaetigung('Termin bestätigt · ' + slot, 'termin');
      kapitel.querySelector('.lauf').appendChild(k);
      runter();
      await materialisiere(k);
      await stift.notiz(kapitel, k, 'steht!', 'rechts');
      zeigeChips(kapitel, ['Wie läuft mein Geschäft?', 'Was bringt mir das Preismodell?']);
      kamera.halt();
    })();
  }

  /* ---------- Das Vorführ-Hirn: echte Antworten vom lokalen Server ---------- */
  var hirnAn = false;
  var hirnVerlauf = [];
  fetch('/hirn-status').then(function(r){ return r.json(); }).then(function(s){
    if (s && s.bereit) { hirnAn = true; document.body.classList.add('hirn'); }
  }).catch(function(){ /* kein Server: Drehbuch */ });

  /* Zerlegt ankommenden Text in Wort-Häppchen für den Spielplan (löst *Marken* auf) */
  function neuerZerleger(spielplan){
    return {
      puffer: '', imMerk: false, markZaehler: 0,
      wort(t){
        var teile = t.split('*');
        for (var i = 0; i < teile.length; i++) {
          if (i > 0) {
            this.imMerk = !this.imMerk;
            if (this.imMerk) this.markZaehler++;
          }
          if (teile[i]) spielplan.push({art: 'wort', text: teile[i], merk: this.imMerk ? 'm' + this.markZaehler : null});
        }
      },
      fuege(text){
        this.puffer += text;
        while (true) {
          var br = this.puffer.match(/^\s*\n[ \t]*\n\s*/);
          if (br) { spielplan.push({art: 'absatz'}); this.puffer = this.puffer.slice(br[0].length); continue; }
          var wortVorBruch = this.puffer.match(/^([^\n]*?\S)(?=\s*\n[ \t]*\n)/);
          if (wortVorBruch) { this.wort(wortVorBruch[1] + ' '); this.puffer = this.puffer.slice(wortVorBruch[0].length); continue; }
          var m = this.puffer.match(/^([^\n]*?\S)([ \t]+|\n(?![ \t]*\n))/);
          if (m) { this.wort(m[1] + ' '); this.puffer = this.puffer.slice(m[0].length); continue; }
          break;
        }
      },
      ende(){ if (this.puffer.trim()) this.wort(this.puffer.trim() + ' '); this.puffer = ''; }
    };
  }

  /* Trägt Wörter mit ruhiger Hand in die Seite (die Anzeige-Seite des Spielplans) */
  function neuerSchreiber(kapitel){
    var lauf = kapitel.querySelector('.lauf');
    return {
      absatz: null, huelle: null, huelleSk: null, klartext: '',
      neuerAbsatz(){
        if (this.absatz) this.absatz.classList.remove('aktiv');
        this.absatz = null; this.huelle = null; this.huelleSk = null;
      },
      fertig(){ if (this.absatz) this.absatz.classList.remove('aktiv'); },
      wo(merk){
        if (!this.absatz) {
          this.absatz = document.createElement('p');
          this.absatz.className = 'antwort aktiv';
          lauf.appendChild(this.absatz);
          this.huelle = null; this.huelleSk = null;
        }
        if (merk !== this.huelleSk) {
          if (merk) {
            this.huelle = document.createElement('span');
            this.huelle.className = 'merk';
            this.huelle.dataset.sk = merk;
            this.absatz.appendChild(this.huelle);
          } else {
            this.huelle = null;
          }
          this.huelleSk = merk;
        }
        return this.huelle || this.absatz;
      },
      zeige(token){
        var s = document.createElement('span');
        s.className = 'wort';
        s.textContent = token.text;
        this.wo(token.merk).appendChild(s);
        if (reduziert) s.classList.add('da');
        else {
          requestAnimationFrame(function(){ s.classList.add('da'); });
          s.addEventListener('transitionend', function(){ s.classList.add('fest'); }, {once:true});
        }
        this.klartext += token.text;
      }
    };
  }

  async function hirnFrage(text){
    beschaeftigt = true;
    var kapitel = neuesKapitel(text);
    kamera.start();
    var schreiber = neuerSchreiber(kapitel);
    var lauf = kapitel.querySelector('.lauf');
    var denk = zeigeDenken(kapitel);
    var reihe = null;
    function schliesseReihe(){ reihe = null; }
    async function karteRein(d){
      var klein = (d.art === 'kpi' || d.art === 'hebel' || d.art === 'donut');
      var k = null;
      if (d.art === 'kpi') k = baueKpi(d);
      if (d.art === 'hero') k = baueHero(d);
      if (d.art === 'hebel') k = baueHebel(d);
      if (d.art === 'kurve') k = baueKurve({von: d.von || 'März', bis: d.bis || 'August', alt: d.alt || 'Verlauf', sk: d.sk});
      if (d.art === 'wasserfall' && d.start && d.schritte) k = baueWasserfall(d);
      if (d.art === 'formel' && d.zeilen) k = baueFormel(d);
      if (d.art === 'fahrplan' && d.schritte) k = baueFahrplan(d);
      if (d.art === 'vergleich' && d.vorher && d.nachher) k = baueVergleich(d);
      if (d.art === 'donut') k = baueDonut(d);
      if (d.art === 'dokument') k = baueDokument(d);
      if (d.art === 'kalender') k = baueKalender(d.slots || ['Donnerstag, 10:00', 'Donnerstag, 16:00', 'Freitag, 9:00']);
      if (d.art === 'bestaetigung') k = baueBestaetigung(d.text || 'Erledigt', d.sk);
      if (!k) return;
      if (klein) {
        if (!reihe) { reihe = document.createElement('div'); reihe.className = 'reihe'; lauf.appendChild(reihe); }
        reihe.appendChild(k);
        reihe.className = 'reihe' + (reihe.children.length === 2 ? ' zweier' : '');
      } else {
        schliesseReihe();
        lauf.appendChild(k);
      }
      runter();
      var fertigMat = materialisiere(k);
      setTimeout(function(){
        if (d.art === 'kpi') starteKpi(k);
        if (d.art === 'hero') starteHero(k);
        if (d.art === 'hebel') starteHebel(k);
        if (d.art === 'donut') starteDonut(k, d.prozent || 0);
      }, reduziert ? 0 : 500);
      await fertigMat;
    }
    async function skizzeRein(sk){
      var ziel = findeSk(kapitel, sk.ziel);
      if (!ziel) return;
      runter();
      await warte(200);
      if (sk.art === 'kreis') await stift.kreis(kapitel, ziel);
      if (sk.art === 'unterstreich') await stift.unterstreich(kapitel, ziel);
      if (sk.art === 'notiz') await stift.notiz(kapitel, ziel, sk.text || '!', sk.wo);
      if (sk.art === 'pfeil') {
        var nach = findeSk(kapitel, sk.nach);
        if (nach) await stift.pfeil(kapitel, ziel, nach);
      }
    }
    /* Abspiel-Puffer: Ankunft und Anzeige sind entkoppelt. Der Leser füllt den
       Spielplan, die Schreibhand trägt ihn mit ruhigem, mitwachsendem Takt ein. */
    var spielplan = [];
    var zulaufFertig = false;
    var zerleger = neuerZerleger(spielplan);

    async function schreibhand(){
      /* Gleitender Takt: Tempo in Wörtern je Sekunde, stufenlos dem Rückstand
         angepasst — nie ein Sprung. Satzzeichen kosten mehr Einheiten und
         atmen so von selbst; Absätze kosten am meisten. */
      var rate = 6, guthaben = 0, letzte = performance.now();
      while (true) {
        if (!spielplan.length) {
          if (zulaufFertig) break;
          await warte(50);
          letzte = performance.now();
          guthaben = Math.min(guthaben, 1);
          continue;
        }
        if (denk) { denk.weg(); denk = null; letzte = performance.now(); } /* schmilzt weg, während die ersten Worte schon kommen */
        var art = spielplan[0].art;
        if (art === 'wort' || art === 'absatz') {
          schliesseReihe();
          if (reduziert) {
            while (spielplan.length && (spielplan[0].art === 'wort' || spielplan[0].art === 'absatz')) {
              var e0 = spielplan.shift();
              if (e0.art === 'wort') schreiber.zeige(e0); else schreiber.neuerAbsatz();
            }
            continue;
          }
          await new Promise(function(weiter){
            function tick(t){
              var dt = Math.min((t - letzte) / 1000, .08); letzte = t;
              var ziel = Math.min(140, 20 + spielplan.length * 0.5);
              rate += (ziel - rate) * Math.min(1, dt / 0.4);
              guthaben += rate * dt;
              while (spielplan.length) {
                var e = spielplan[0];
                if (e.art === 'wort') {
                  var kosten = wortKosten(e.text);
                  if (guthaben < kosten) break;
                  guthaben -= kosten;
                  spielplan.shift();
                  schreiber.zeige(e);
                } else if (e.art === 'absatz') {
                  if (guthaben < 6) break;
                  guthaben -= 6;
                  spielplan.shift();
                  schreiber.neuerAbsatz();
                } else break;
              }
              if (!spielplan.length || (spielplan[0].art !== 'wort' && spielplan[0].art !== 'absatz')) { weiter(); return; }
              requestAnimationFrame(tick);
            }
            requestAnimationFrame(tick);
          });
          continue;
        }
        var eintrag = spielplan.shift();
        if (eintrag.art === 'karte') {
          schreiber.neuerAbsatz();
          await karteRein(eintrag.karte);
          await warte(260);
        } else if (eintrag.art === 'skizze') {
          schreiber.neuerAbsatz();
          await skizzeRein(eintrag.skizze);
          await warte(180);
        } else if (eintrag.art === 'chips') {
          zeigeChips(kapitel, eintrag.chips);
        } else if (eintrag.art === 'fehler') {
          var p = document.createElement('p');
          p.className = 'antwort fehl';
          p.textContent = 'Das Hirn meldet: ' + eintrag.text;
          lauf.appendChild(p);
        }
        letzte = performance.now();
        guthaben = 0;
      }
      if (denk) { var dEnde = denk; denk = null; await dEnde.weg(); }
      schreiber.fertig();
    }

    async function zulauf(){
      var antwort = await fetch('/frage', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({frage: text, verlauf: hirnVerlauf.slice(-6)})
      });
      var leser = antwort.body.getReader();
      var dekodierer = new TextDecoder();
      var rest = '';
      while (true) {
        var teil = await leser.read();
        if (teil.done) break;
        rest += dekodierer.decode(teil.value, {stream: true});
        var zeilen = rest.split('\n');
        rest = zeilen.pop();
        for (var i = 0; i < zeilen.length; i++) {
          if (!zeilen[i].trim()) continue;
          var e;
          try { e = JSON.parse(zeilen[i]); } catch (fehler) { continue; }
          if (e.art === 'text') { zerleger.fuege(e.text); }
          else if (e.art === 'karte' || e.art === 'skizze' || e.art === 'chips' || e.art === 'fehler') {
            zerleger.ende();
            spielplan.push(e.art === 'karte' ? {art:'karte', karte:e.karte}
              : e.art === 'skizze' ? {art:'skizze', skizze:e.skizze}
              : e.art === 'chips' ? {art:'chips', chips:e.chips}
              : {art:'fehler', text:e.text});
          }
        }
      }
      zerleger.ende();
    }

    try {
      var laufend = schreibhand();
      await zulauf();
      zulaufFertig = true;
      await laufend;
      hirnVerlauf.push({frage: text, antwort: schreiber.klartext.slice(0, 1200)});
    } catch (fehler) {
      zulaufFertig = true;
      if (denk) { denk.weg(); denk = null; }
      var p2 = document.createElement('p');
      p2.className = 'antwort fehl';
      p2.textContent = 'Verbindung zum Hirn verloren: ' + fehler;
      lauf.appendChild(p2);
    }
    kamera.halt();
    beschaeftigt = false;
    runter();
  }

  function frageStellen(text){
    if (beschaeftigt) return;
    var t = text.trim();
    if (!t && !wartendeAnlagen.length) return;
    if (!t) t = 'Schau dir das mal an.';
    var mitgebracht = wartendeAnlagen.length;
    document.getElementById('frage').value = '';
    if (hirnAn) { hirnFrage(t); return; }
    var passendes = null;
    for (var i = 0; i < SKRIPTE.length; i++) {
      if (SKRIPTE[i].probe.test(t)) { passendes = SKRIPTE[i]; break; }
    }
    var kapitel = neuesKapitel(passendes ? passendes.frage : t);
    var schritte = (passendes || SONST).schritte;
    if (mitgebracht) {
      schritte = [{t: mitgebracht > 1
        ? 'Angekommen — deine Unterlagen liegen mit in der Akte, ich habe sie gelesen.'
        : 'Angekommen — deine Unterlage liegt mit in der Akte, ich habe sie gelesen.'}].concat(schritte);
    }
    spiele(kapitel, schritte);
  }

  document.getElementById('senden').addEventListener('click', function(){
    frageStellen(document.getElementById('frage').value);
  });
  document.getElementById('frage').addEventListener('keydown', function(e){
    if (e.key === 'Enter') frageStellen(this.value);
  });

  /* ---------- Die Akte als Regal ---------- */
  (function(){
    var regal = document.getElementById('regal');
    var inhalt = document.getElementById('regal-inhalt');
    var zu = document.getElementById('regal-zu');
    function oeffneRegal(){
      inhalt.innerHTML = '';
      var kapitel = document.querySelectorAll('#akte .kapitel');
      var leer = true;
      kapitel.forEach(function(kap){
        var karten = kap.querySelectorAll('.lauf .karte');
        if (!karten.length) return;
        leer = false;
        var h = document.createElement('h3');
        h.textContent = kap.querySelector('.frage').textContent.replace(/ \+$/, '');
        inhalt.appendChild(h);
        var brett = document.createElement('div');
        brett.className = 'brett';
        karten.forEach(function(k){
          var klon = k.cloneNode(true);
          klon.classList.add('belichtet');
          klon.querySelectorAll('button').forEach(function(b){ b.disabled = true; });
          brett.appendChild(klon);
        });
        inhalt.appendChild(brett);
      });
      if (leer) {
        var p = document.createElement('p');
        p.className = 'leer';
        p.textContent = 'Noch leer. Stell eine Frage, und die Akte füllt sich von selbst.';
        inhalt.appendChild(p);
      }
      regal.classList.add('offen');
      regal.setAttribute('aria-hidden', 'false');
      zu.hidden = false;
      document.body.classList.add('regal-offen');
    }
    function schliesseRegal(){
      regal.classList.remove('offen');
      regal.setAttribute('aria-hidden', 'true');
      zu.hidden = true;
      document.body.classList.remove('regal-offen');
    }
    document.getElementById('akte-griff').addEventListener('click', oeffneRegal);
    zu.addEventListener('click', schliesseRegal);
    window.addEventListener('keydown', function(e){
      if (e.key !== 'Escape') return;
      if (blattBlick.offen()) { blattBlick.schliesse(); return; }
      if (regal.classList.contains('offen')) schliesseRegal();
    });
  })();

  /* ---------- Weißmarke: die Beratung bringt ihre eigene Marke mit ----------
     Vier Regler tragen die ganze Oberfläche: Papier, Tinte, Akzent, Stift.
     Im Produkt kommen diese Werte aus dem Mandanten-Profil der Beratung. */
  (function(){
    var MARKEN = [
      {name:'Nordholm & Partner',  blau:'#2b5fe3', stift:'#1d46c9', tinte:'#10131a', papier:'#fafaf7'},
      {name:'Waldmann Consulting', blau:'#0e7a5a', stift:'#0a5f46', tinte:'#101613', papier:'#f8faf7'},
      {name:'Steinbach & Cie.',    blau:'#9c3948', stift:'#7c2d3a', tinte:'#171114', papier:'#fbf9f7'},
      /* echtes Logo als Sehprobe (Jonas, 2026-08-12) — zeigt den logo_url-Platz der Weißmarke */
      {name:'currily',             blau:'#7047EA', stift:'#5636b8', tinte:'#081B4A', papier:'#fbfafd', logo:'bilder/currily-logo.svg'}
    ];
    var idx = 0;
    try { idx = parseInt(sessionStorage.getItem('marke') || '0', 10) % MARKEN.length || 0; } catch (e) {}
    function trage(m){
      var s = document.documentElement.style;
      s.setProperty('--blau', m.blau);
      s.setProperty('--stift', m.stift);
      s.setProperty('--tinte', m.tinte);
      s.setProperty('--papier', m.papier);
      document.getElementById('marke-name').textContent = m.name;
      var logo = document.getElementById('marke-logo');
      var name = document.getElementById('marke-name');
      if (m.logo) {
        logo.src = m.logo;
        logo.alt = m.name;
        logo.hidden = false;
        name.hidden = true;
      } else {
        logo.hidden = true;
        logo.removeAttribute('src');
        name.hidden = false;
      }
      var icon = document.querySelector('link[rel="icon"]');
      if (icon) icon.href = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='10' fill='" + encodeURIComponent(m.blau) + "'/%3E%3C/svg%3E";
    }
    function weiter(){
      idx = (idx + 1) % MARKEN.length;
      try { sessionStorage.setItem('marke', String(idx)); } catch (e) {}
      trage(MARKEN[idx]);
    }
    if (idx) trage(MARKEN[idx]);
    var knopf = document.getElementById('marke-wechsel');
    knopf.addEventListener('click', weiter);
    knopf.addEventListener('keydown', function(e){
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); weiter(); }
    });
  })();

  /* ---------- Auftakt ---------- */
  (function(){
    var gruss = document.getElementById('gruss');
    var ziel = 'Womit ringst du gerade?';
    var el = document.getElementById('gruss-text');
    var vorgruss = document.getElementById('vorgruss');
    var startChips = ['Wie läuft mein Geschäft?', 'Warum schrumpft meine Marge?', 'Buch mir einen Menschen'];

    /* Der Gruß kennt die Uhrzeit — wie ein Berater, nicht wie ein Formular */
    var stunde = new Date().getHours();
    vorgruss.textContent = stunde < 5 ? 'Gute Nacht.' : (stunde < 11 ? 'Guten Morgen.' : (stunde < 18 ? 'Guten Tag.' : 'Guten Abend.'));

    /* Der Stift zieht seinen Anstrich von Hand: leicht zittrig, nie zweimal gleich */
    var anstrich = gruss.querySelector('.anstrich');
    var pts = [];
    for (var p = 0; p <= 6; p++) pts.push([2 + 92 * p / 6, 6 + zufall(-2, 2)]);
    var pfad = document.createElementNS(NS, 'path');
    pfad.setAttribute('d', glatt(pts));
    anstrich.appendChild(pfad);

    function chipsRein(){
      var lage = document.getElementById('start-chips');
      startChips.forEach(function(c, i){
        var b = document.createElement('button');
        b.type = 'button'; b.textContent = c;
        b.addEventListener('click', function(){ frageStellen(c); });
        lage.appendChild(b);
        setTimeout(function(){ b.classList.add('da'); }, reduziert ? 0 : 140 * i + 100);
      });
    }
    if (reduziert) { el.textContent = ziel; vorgruss.classList.add('da'); gruss.classList.add('da'); chipsRein(); return; }
    var laenge = pfad.getTotalLength();
    pfad.style.strokeDasharray = laenge;
    pfad.style.strokeDashoffset = laenge;
    pfad.style.transition = 'stroke-dashoffset .55s cubic-bezier(.45,.05,.55,.95) .15s';
    void pfad.getBoundingClientRect();
    pfad.style.strokeDashoffset = 0;
    setTimeout(function(){ gruss.classList.add('da'); vorgruss.classList.add('da'); }, 450);
    var i = 0;
    setTimeout(function tippe(){
      el.textContent = ziel.slice(0, ++i);
      if (i < ziel.length) setTimeout(tippe, 42 + Math.random() * 40);
      else { chipsRein(); document.getElementById('frage').focus(); }
    }, 1250);
  })();
})();

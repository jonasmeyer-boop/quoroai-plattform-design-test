<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>quoroAI</title>
<link rel="icon" href="bilder/quoro-icon.svg">
<link rel="stylesheet" href="system.css">
<style>
/* quoroai-plattform-design · Die quoroAI-Wurzel: die Adresse ohne Beratung
   dahinter. Entscheidung Jonas 2026-08-14: eine Tür mit Haltung, ein
   Bildschirm, keine Verkaufsargumente. Gescrollt wird nur, wenn das Fenster
   zu niedrig ist, damit der Fuß erreichbar bleibt.
   Inhalt aus dem Produkt (../quoroai-plattform/src/app/page.tsx): der Satz
   und die zwei Wege (Beratung anlegen / Anmelden). Nur der Inhalt, nie das
   Styling. V8 (Jonas, 2026-08-19): EINE Tür für alle — auch wir selbst
   melden uns hier nur an, die Abrechnung liegt hinter der Anmeldung
   (plattform.html), und die Lage „Adresse gehört keiner Beratung" wohnt bei
   den Sackgassen (sackgasse.html#adresse), denn sie ist eine andere Adresse,
   kein Zustand dieser. Der Vorführungs-Umschalter ist damit weg.
   Der eine Fancy-Moment: das Licht geht an. Dasselbe Modell wie überall,
   erst ohne Farbe, dann kommt das Abendlicht dazu — ein Bild, nur ein
   Filter, damit beim Umschalten nichts springt. Das Bild ist
   stadt-weiss.jpg: stadt.jpg mit ffmpeg auf reines Weiß gezogen
   (colorlevels 0.93), sonst zeichnet multiply ein graues Rechteck auf die
   weiße Seite.
   V6 (Issue #58, historisch, Kasten seit V8 weg): der Vorführungs-Kasten sagt, was er ist — „Vorführung:
   Lage der Adresse wechseln" —, auch am Telefon.
   Marker: WURZEL-V8 (V8: eine Tür für alle, ohne Umschalter. V7: die Wurzel ist die Startadresse index.html, der
   Katalog liegt unter stand.html — Chronik 2026-08-19. V4: die Abrechnung führt in den gezeichneten
   Plattformbereich plattform.html; die Hinweiszeile ist weg, sie hatte mit
   dem Knopf ihren einzigen Text verloren. V5: Impressum und Datenschutz
   führen auf quoro-impressum.html und quoro-datenschutz.html — eine
   öffentliche Adresse in Deutschland braucht beide erreichbar.) */
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
button{font-family:inherit}
html,body{min-height:100%}
/* Kein overflow:hidden — auf niedrigen Fenstern muss der Fuß mit Impressum
   und Datenschutz erreichbar bleiben (Chronik 2026-08-14) */
body{background:var(--grund)}

.raum{
  min-height:100svh;display:grid;
  grid-template-rows:auto auto minmax(0,1fr) auto;
  padding:clamp(18px,3svh,30px) 22px calc(10px + env(safe-area-inset-bottom));
  gap:clamp(10px,2svh,20px);
}

/* ---------- Kopf: die Wortmarke ---------- */
.wortmarke{
  display:flex;align-items:center;gap:10px;justify-self:start;
  font-family:var(--schrift-schau);font-weight:var(--schau-gewicht);
  font-size:19px;letter-spacing:var(--schau-spur);
}
.wortmarke img{width:32px;height:32px;display:block}
.wortmarke small{
  display:block;font-family:var(--schrift-text);font-weight:400;
  font-size:12px;letter-spacing:0;color:var(--nebel-600);margin-top:-3px;
}

/* ---------- Mitte: die Tür ---------- */
.mitte{display:grid;align-content:start;justify-items:center;text-align:center;padding-top:clamp(4px,3svh,34px)}
.tuer{max-width:min(100%,44ch)}
h1{font-size:clamp(26px,3.4vw,38px);max-width:min(100%,15em);margin:0 auto}
.satz{
  font-size:clamp(15px,1.5vw,17.5px);color:var(--nebel-600);
  margin-top:14px;line-height:1.55;
}
.wege{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:26px}
.wege .knopf{text-decoration:none}

/* ---------- Das Modell: erst unbelichtet, dann geht das Licht an ---------- */
/* min-height, sonst schrumpft die Bildzeile auf niedrigen Fenstern zu einem
   Strich, während die Aurora in voller Größe weiterleuchtet */
.modell{position:relative;min-height:min(38svh,260px);display:grid;place-items:center}
.modell img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;object-position:center bottom;
  mix-blend-mode:multiply;
  /* unbelichtet: dasselbe Bild ohne Farbe — so springt beim Lichtanmachen
     nichts, es kommt nur das Licht dazu */
  filter:saturate(.06) brightness(1.04);
  transition:filter 1.7s ease;
}
/* die Aufhellung bleibt: der JPEG-Grund liegt knapp unter Weiß, und multiply
   zeichnet daraus sonst ein blasses Rechteck */
body.erwacht .modell img{filter:brightness(1.04)}
.modell .aurora{
  position:absolute;left:50%;top:42%;translate:-50% -50%;
  /* misst sich an der Bildzeile, nicht am Fenster — sonst leuchtet sie auf
     flachen Fenstern größer als das Modell, das sie beleuchten soll */
  height:min(100%,340px);width:auto;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle, color-mix(in srgb, var(--lila-500) 30%, transparent) 0%, transparent 66%);
  filter:blur(34px);opacity:0;transition:opacity 1.6s ease;pointer-events:none;
}
body.erwacht .modell .aurora{opacity:1}
@media (prefers-reduced-motion:reduce){
  .modell img,.modell .aurora{transition-duration:.01ms}
}

/* ---------- Fuß ---------- */
.fuss{
  display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;justify-content:center;
  font-size:13px;color:var(--nebel-600);
}
.fuss a{color:var(--nebel-600);text-decoration:none}
.fuss a:hover{color:var(--lila-700)}

@media (max-width:640px){
  .raum{gap:12px;padding-top:14px}
  .wege{flex-direction:column;align-items:stretch}
  .wege .knopf{width:100%}
}
@media (max-width:780px){
  h1{font-size:clamp(22px,6.2vw,28px)}
}
</style>
</head>
<body class="quoro">
<div class="raum">
  <div class="wortmarke">
    <img src="bilder/quoro-icon.svg" alt="" width="32" height="32">
    <div>quoroAI<small>White-Label-Plattform</small></div>
  </div>

  <main class="mitte">
    <div class="tuer" id="t-wurzel">
      <h1>Die Software für Unternehmensberatungen.</h1>
      <p class="satz">Und der KI-Berater, den sie unter ihrer eigenen Marke weitergibt. Jedes Mandat ein Haus, die ganze Beratung ein Modell, durch das man gehen kann.</p>
      <div class="wege">
        <a class="knopf primaer" href="registrieren.html">Beratung anlegen</a>
        <a class="knopf sekundaer" href="registrieren.html#anmelden">Anmelden</a>
      </div>
    </div>
  </main>

  <div class="modell" aria-hidden="true">
    <div class="aurora"></div>
    <img id="stadt" src="bilder/modell/stadt-weiss.jpg" alt="">
  </div>

  <div class="fuss">
    <span>quoroAI</span>
    <a href="quoro-impressum.html">Impressum</a>
    <a href="quoro-datenschutz.html">Datenschutz</a>
  </div>
</div>

<script>
(function(){
  'use strict';
  var reduziert = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---- der eine Fancy-Moment: das Licht geht an ---- */
  var stadt = document.getElementById('stadt');
  var angekommen = false;
  function licht(){ angekommen = true; if (!document.body.dataset.dunkel) document.body.classList.add('erwacht'); }
  if (reduziert) licht();
  else if (stadt.complete && stadt.naturalWidth) setTimeout(licht, 700);
  else {
    stadt.addEventListener('load', function(){ setTimeout(licht, 400); });
    /* kommt das Bild nicht, bleibt wenigstens der Schein an — sonst hinge die
       Seite für immer im unbelichteten Zustand fest */
    stadt.addEventListener('error', licht);
  }

})();
</script>
</body>
</html>
